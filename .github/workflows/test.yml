# The test suite (tests/) on every push and pull request: pages and scripts parse, every endpoint refuses
# callers who aren't signed in, pricing and discounts add up. Needs no secrets.
# (On main the Deploy workflow runs them too, and deploys only when they pass.)
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
