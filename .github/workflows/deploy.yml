name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_d1wSJnMc3LyQ6DQ8gT0DOAiF
  VERCEL_PROJECT_ID: prj_I7q4Oh0Cxk7nkEWK4a1tCRURdWAl

jobs:
  # Nothing reaches the site unless the tests pass, including every page opened in Chrome as a client,
  # the admin and an artist (tests/pages-run.test.mjs)
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          CI: true

  deploy-vercel:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
