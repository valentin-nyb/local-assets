    <script>
      (function(){
        var s = localStorage.getItem('la_admin');
        if (!s) { window.location.replace('/login.html'); return; }
        try {
          var d = JSON.parse(s);
          if (!d.ts || Date.now() - d.ts > 10 * 60 * 1000) {
            localStorage.removeItem('la_admin');
            window.location.replace('/login.html');
          }
        } catch(e) {
          localStorage.removeItem('la_admin');
          window.location.replace('/login.html');
        }
      })();

                        <label class="ing-field" id="ingest-label-wrap"><span>Record label</span><select id="ingest-label"><option value="">No record label</option><option value="__new">+ New record label…</option></select></label>
                        <label class="ing-field hidden" id="ingest-label-new-wrap"><span>New record label</span><input type="text" id="ingest-label-new" maxlength="60" placeholder="e.g. Record Label Name" autocomplete="off"></label>
                        <label class="ing-field"><span>Date of the set</span><input type="text" id="ingest-date" placeholder="Choose a date"></label>
                        <label class="ing-field"><span>Camera</span><select id="ingest-shot">
                            <option value="MASTER">Main camera</option>
                            <option value="BOOTH">Booth camera</option>
                            <option value="PTZ01">PTZ 01</option>
                            <option value="PTZ02">PTZ 02</option>
                            <option value="PTZ03">PTZ 03</option>
                        </select></label>
                    </div>
                    <label class="ing-drop" id="node-video">
                        <span class="ing-drop-label">4K Master (.MP4)</span>
                        <span class="ing-drop-ico"><iconify-icon icon="lucide:video"></iconify-icon></span>
                        <b class="ing-drop-main" id="ing-file">ADD THE RECORDING OF THE SET</b>
                        <small class="ing-drop-meta" id="ing-meta">Drag it here, or choose the file.</small>
                        <span class="ing-drop-btn" id="ing-pick">Choose file</span>
                        <span class="ing-drop-specs"><i>MP4 · MOV</i><i>Up to 4K</i><i>Straight to Cloud Storage</i></span>
                        <input type="file" id="file-video" class="hidden" accept="video/*" onchange="markActive('video')">
                    </label>
                    <div class="ing-foot">
                        <div class="ing-progress" id="ing-progress" hidden><i id="ing-bar"></i></div>
                        <button id="upload-btn" class="ing-btn" type="button">Upload session</button>
                    </div>
                    <p id="pipeline-status" class="hidden ing-status"></p>
                </section>                  <div id="preview-container" class="hidden border-b border-zinc-800 pb-12">                     <h2 id="vault-dj-title" class="text-3xl font-black italic mb-6"></h2>                     <div id="active-asset-display" class="max-w-4xl mx-auto"></div>                 </div>                  <div class="space-y-4">                     <h3 class="text-[10px] font-mono text-zinc-600 uppercase tracking-[0.3em] border-b border-zinc-800 pb-2">Vault History</h3>                     <div id="cloud-list"></div>                 </div>             </div>         </div>     
        <div class="la-statusbar w-full h-10 bg-black border-t border-[#27272a] flex items-center justify-between px-4 md:px-6 shrink-0">
            <div class="flex items-center gap-2 md:gap-4 text-[7px] md:text-[9px] font-mono text-zinc-600 uppercase tracking-widest">
                <span>LOCAL / ASSETS V2.4.0</span>
            </div>
            
        </div>
</main>
<script>
    function laFetch(url, opts = {}) {
        const session = (() => { try { return JSON.parse(localStorage.getItem('la_admin') || '{}'); } catch(_) { return {}; } })();
        opts = Object.assign({}, opts);
        opts.headers = Object.assign({}, opts.headers);
        if (session.webToken) opts.headers['Authorization'] = 'Bearer ' + session.webToken;
        if (session.email)    opts.headers['X-User-Email']  = session.email;
        return fetch(url, opts);
    }

    // Toggle Sidebar for Mobile
    window.toggleSidebar = () => {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebar-overlay');
        sb.classList.toggle('-translate-x-full');
        ov.classList.toggle('hidden');
        setTimeout(() => ov.classList.toggle('opacity-0'), 10);
    };

    // The video codec of a file, read from its header and its end (where an MP4/MOV keeps its index),
    // so a file Cloud Storage has to convert first (AV1, HEVC, ProRes) is flagged before it's uploaded
    window._slowCodec = null;
    async function slowCodec(f) {
        const look = async (blob) => new Uint8Array(await blob.arrayBuffer());
        const chunk = 4 * 1024 * 1024;
        const parts = [await look(f.slice(0, chunk))];
        if (f.size > chunk) parts.push(await look(f.slice(Math.max(chunk, f.size - chunk))));
        const text = parts.map(b => { let t = ''; for (let i = 0; i < b.length; i++) t += String.fromCharCode(b[i]); return t; }).join('');
        // MP4/MOV: the codec sits in the sample description ('stsd') right after its header; MKV/WebM names it
        const mp4 = (/stsd[\s\S]{8,24}?(av01|hvc1|hev1|apch|apcn|apcs|apco|ap4h|ap4x)/.exec(text) || [])[1];
        if (mp4 === 'av01' || /V_AV1/.test(text)) return 'AV1';
        if (mp4 === 'hvc1' || mp4 === 'hev1' || /V_MPEGH\/ISO\/HEVC/.test(text)) return 'HEVC (H.265)';
        if (mp4) return 'ProRes';
        return null;
    }
    window.markActive = (type) => {
        const node = document.getElementById('node-' + type);
        node?.classList.add('active');
        const f = document.getElementById('file-video').files[0];
        if (f) {
            const gb = f.size / 1e9;
            const size = (gb >= 1 ? gb.toFixed(2) + ' GB' : Math.max(1, Math.round(f.size / 1e6)) + ' MB');
            const meta = document.getElementById('ing-meta');
            document.getElementById('ing-file').textContent = f.name;
            meta.textContent = size + ' · ready to upload';
            meta.classList.remove('ing-warn');
            document.getElementById('ing-pick').textContent = 'Change file';
            window._slowCodec = null;
            if (/^video\//.test(f.type) || /\.(mp4|mov|m4v|mkv|webm)$/i.test(f.name)) slowCodec(f).then(c => {
                if (document.getElementById('file-video').files[0] !== f) return;
                window._slowCodec = c;
                if (c) { meta.textContent = size + ' · ' + c + ' video: takes about as long as the set to process. Export as H.264 MP4 to have it ready in minutes.'; meta.classList.add('ing-warn'); }
            }).catch(() => {});
        }
    };
    // Drag a file onto the drop zone
    document.addEventListener('DOMContentLoaded', () => {
        const drop = document.getElementById('node-video'), input = document.getElementById('file-video');
        if (!drop) return;
        ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
        drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; markActive('video'); } });
    });

    function updateNodeForCamera(camera) {
        const fileInput = document.getElementById('file-video');
        const nodeIcon  = document.querySelector('#node-video iconify-icon');
        const nodeLabel = document.querySelector('#node-video span');
        const map = {
            AUDIO:  { accept: 'audio/*', icon: 'lucide:music',                     label: 'HQ Audio (.WAV/.MP3/.M4A)' },
            SOCIAL: { accept: 'video/*', icon: 'lucide:smartphone',                label: 'Social Clip (.MP4)'         },
            THUMB:  { accept: 'image/*', icon: 'lucide:image', label: 'Thumbnail (.PNG/.JPG)'      },
        };
        const cfg = map[camera] || { accept: 'video/*', icon: 'lucide:video', label: '4K Master (.MP4)' };
        if (fileInput)  fileInput.accept = cfg.accept;
        if (nodeIcon)   nodeIcon.setAttribute('icon', cfg.icon);
        if (nodeLabel)  nodeLabel.textContent = cfg.label;
    }

    window.onload = function() {
        // Read query params before flatpickr so we can set defaultDate
        const _qp     = new URLSearchParams(window.location.search);
        const _artist = _qp.get('artist');
        const _date   = _qp.get('date');
        const _camera = _qp.get('camera');

        // Shown as "13 October 2026"; the upload still gets 2026-10-13
        window.LA_DATE_PICK = { monthSelectorType: 'static', altInput: true, altFormat: 'j F Y', dateFormat: 'Y-m-d', disableMobile: true };
        flatpickr("#ingest-date", Object.assign({ defaultDate: _date || "today" }, window.LA_DATE_PICK));
        loadVault(); // Load the real Mux data immediately

        if (_artist) document.getElementById('ingest-name').value = _artist;
        if (_camera) {
            document.getElementById('ingest-shot').value = _camera;
            updateNodeForCamera(_camera);
        }

        // Venues from the Brand Kit, or a new one (saved to the Brand Kit on upload)
        (async function loadVenues() {
            try {
                const r = await laFetch('/api/brand'), d = await r.json();
                const names = Object.entries(d.ownerNames || {}).filter(([k]) => k.startsWith('venue-')).map(([, v]) => v).filter(Boolean).sort((a, b) => a.localeCompare(b));
                const sel = document.getElementById('ingest-venue');
                const h = n => String(n).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
                sel.innerHTML = '<option value="">No venue</option>' + names.map(n => '<option>' + h(n) + '</option>').join('') + '<option value="__new">+ New venue…</option>';
                const labels = Object.entries(d.ownerNames || {}).filter(([k]) => k.startsWith('label-')).map(([, v]) => v).filter(Boolean).sort((a, b) => a.localeCompare(b));
                document.getElementById('ingest-label').innerHTML = '<option value="">No record label</option>' + labels.map(n => '<option>' + h(n) + '</option>').join('') + '<option value="__new">+ New record label…</option>';
                // The account itself is the venue (or the label): that field isn't asked
                _orgType = d.orgType || 'venue';
                document.getElementById('ingest-venue-wrap').classList.toggle('hidden', _orgType === 'venue');
                document.getElementById('ingest-label-wrap').classList.toggle('hidden', _orgType === 'label');
                // An artist account uploads its own sets: the artist is the account. A venue or record label
                // has many DJs: type one, with the Brand Kit's artists suggested.
                const nameIn = document.getElementById('ingest-name');
                if (d.orgType === 'artist') {
                    let me = d.orgName; try { me = me || JSON.parse(localStorage.getItem('la_admin') || '{}').venue; } catch (_) {}
                    if (me) { nameIn.value = String(me).toUpperCase(); nameIn.readOnly = true; nameIn.classList.add('ing-locked'); nameIn.title = 'Uploads on this account are for ' + me; }
                } else {
                    // A venue or record label picks one of its Brand Kit artists, or adds a new one
                    const artists = Object.entries(d.ownerNames || {}).filter(([k]) => k.startsWith('artist-')).map(([, v]) => String(v).toUpperCase()).filter(Boolean).sort((a, b) => a.localeCompare(b));
                    nameIn.placeholder = 'e.g. DJ Name';
                    if (artists.length) {
                        const pick = document.getElementById('ingest-artist-pick');
                        pick.innerHTML = '<option value="">Choose the artist</option>' + artists.map(n => '<option>' + h(n) + '</option>').join('') + '<option value="__new">+ New artist…</option>';
                        document.getElementById('ingest-artist-pick-wrap').hidden = false;
                        document.getElementById('ingest-name-label').textContent = 'New artist';
                        const cur = nameIn.value.trim().toUpperCase();
                        if (cur && artists.includes(cur)) pick.value = cur; else if (cur) pick.value = '__new';
                        document.getElementById('ingest-name-wrap').classList.toggle('hidden', pick.value !== '__new');
                        pick.addEventListener('change', () => {
                            const isNew = pick.value === '__new';
                            document.getElementById('ingest-name-wrap').classList.toggle('hidden', !isNew);
                            nameIn.value = isNew ? '' : pick.value;
                            if (isNew) nameIn.focus();
                        });
                        if (pick.value && pick.value !== '__new') nameIn.value = pick.value;
                    }
                }
            } catch (_) {}
        })();
        let _orgType = 'venue';
        document.getElementById('ingest-label').addEventListener('change', function() {
            const isNew = this.value === '__new';
            document.getElementById('ingest-label-new-wrap').classList.toggle('hidden', !isNew);
            if (isNew) document.getElementById('ingest-label-new').focus();
        });
        document.getElementById('ingest-venue').addEventListener('change', function() {
            const isNew = this.value === '__new';
            document.getElementById('ingest-venue-new-wrap').classList.toggle('hidden', !isNew);
            if (isNew) document.getElementById('ingest-venue-new').focus();
        });
        document.getElementById('ingest-shot').addEventListener('change', function() {
            updateNodeForCamera(this.value);
        });

        const uploadBtn = document.getElementById('upload-btn');
        uploadBtn.onclick = async function() {
            const file    = document.getElementById('file-video').files[0];
            const artist  = document.getElementById('ingest-name').value.trim();
            const dateVal = document.getElementById('ingest-date').value || new Date().toISOString().slice(0, 10);
            const camera  = document.getElementById('ingest-shot').value || 'MASTER';
            if (!file || !artist) return alert(!artist ? "Add the artist's name." : "Choose the recording to upload.");
            // AV1, HEVC or ProRes: Cloud Storage converts the whole file first, which takes about as long as the set
            if (window._slowCodec && !(await laConfirm({ title: 'This file will take a while to process', message: 'It uses ' + window._slowCodec + ' video, which Cloud Storage has to convert first: about as long as the set itself (an hour-long set takes about an hour). Exported as H.264 MP4 (constant frame rate, AAC audio), it is ready in minutes.', confirmText: 'Upload anyway', cancelText: 'Choose another file' }))) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Connecting…';
            // The session's name, saved like "Edit session" does, so it shows as soon as the upload is in
            const title = document.getElementById('ingest-title').value.trim();
            const vSel = _orgType === 'venue' ? '' : document.getElementById('ingest-venue').value;
            const venue = vSel === '__new' ? document.getElementById('ingest-venue-new').value.trim() : vSel;
            const lSel = _orgType === 'label' ? '' : document.getElementById('ingest-label').value;
            const label = lSel === '__new' ? document.getElementById('ingest-label-new').value.trim() : lSel;
            if (title || venue || label) laFetch('/api/session-meta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ artist, date: dateVal, title, venue, label }) }).catch(() => {});
            const ownerKey = (prefix, n) => prefix + n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
            const addOwner = (prefix, n) => { const key = ownerKey(prefix, n); if (key !== prefix) laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOwnerName', owner: key, name: n }) }).catch(() => {}); };
            // A new artist or record label joins the Brand Kit
            if (lSel === '__new' && label) addOwner('label-', label);
            const pickEl = document.getElementById('ingest-artist-pick');
            if (_orgType !== 'artist' && (!pickEl || pickEl.value === '__new' || document.getElementById('ingest-artist-pick-wrap').hidden)) addOwner('artist-', artist);
            // A new venue joins the Brand Kit's venues
            if (vSel === '__new' && venue) {
                const key = 'venue-' + venue.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
                if (key !== 'venue-') laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOwnerName', owner: key, name: venue }) }).catch(() => {});
            }

            try {
                const response = await laFetch('/api/get-upload-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ artist, date: dateVal, camera })
                });
                if (!response.ok) {
                    const errBody = await response.text();
                    throw new Error('Server ' + response.status + ': ' + errBody);
                }
                const data = await response.json();
                if (!data.url) throw new Error('No upload URL returned: ' + JSON.stringify(data));

                const xhr = new XMLHttpRequest();
                xhr.open('PUT', data.url);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        uploadBtn.textContent = 'Uploading · ' + pct + '%';
                        document.getElementById('ing-progress').hidden = false;
                        document.getElementById('ing-bar').style.width = pct + '%';
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        uploadBtn.textContent = 'Uploaded · processing';
                        uploadBtn.classList.add('done');
                        setTimeout(loadVault, 5000);

                        // Auto-trigger social clip pipeline
                        triggerPipeline(data.id, artist);
                    } else {
                        alert('Upload failed: HTTP ' + xhr.status);
                        uploadBtn.textContent = 'Upload session';
                        uploadBtn.disabled = false;
                    }
                };
                xhr.onerror = () => {
                    alert('Network error during upload — check CORS or connectivity.');
                    uploadBtn.innerHTML = "INGEST";
                    uploadBtn.disabled = false;
                };
                xhr.send(file);
            } catch (err) {
                alert("UPLOAD ERROR: " + err.message);
                uploadBtn.innerHTML = "INGEST";
                uploadBtn.disabled = false;
            }
        };
    };

    async function triggerPipeline(uploadId, artistName) {
        var pipelineStatus = document.getElementById('pipeline-status');
        if (pipelineStatus) { pipelineStatus.textContent = 'Preparing the session…'; pipelineStatus.classList.remove('hidden'); }
        try {
            const r = await laFetch('/api/pipeline-trigger', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uploadId, artistName })
            });
            const j = await r.json();
            if (j.jobId) {
                localStorage.setItem('la_pipeline_job', j.jobId);
                if (pipelineStatus) pipelineStatus.textContent = 'Vertical clips are cut as soon as the recording is processed. Follow it in Distribution History.';
                console.log('[Pipeline] Job queued:', j.jobId);
            } else {
                if (pipelineStatus) pipelineStatus.textContent = 'PIPELINE: ' + (j.error || 'unknown error');
                console.warn('[Pipeline] Trigger returned:', j);
            }
        } catch (e) {
            if (pipelineStatus) pipelineStatus.textContent = 'PIPELINE TRIGGER FAILED: ' + e.message;
            console.error('[Pipeline] Trigger error:', e.message);
        }
    }

    // THE MAGIC: Fetches live data from Mux via your new API
    async function loadVault() {
    const list = document.getElementById('cloud-list');
    try {
        const [res, metaRes] = await Promise.all([
            laFetch('/api/list-assets?t=' + Date.now(), { credentials: 'include' }),
            laFetch('/api/session-meta').catch(() => null),
        ]);
        const data = await res.json();
        window._sessMeta = (metaRes && metaRes.ok ? (await metaRes.json()).sessions : null) || {};

        // Safety Net: If the API sent an error instead of a list
        if (data.error) {
            list.innerHTML = `<p class="text-red-500 font-mono text-[10px] uppercase">VAULT ERROR: ${data.error}</p>`;
            return;
        }

        // One card per session, found the same way as Distribution History: every asset labelled with an
        // artist (and its date) belongs to that artist's session on that day; the card shows its 4K long form.
        const SUB = new Set(['AUDIO', 'SOCIAL', 'SOCIALRAW', 'THUMB']);   // any camera (Master, Booth, PTZ) is a long form
        const all = (Array.isArray(data) ? data : (data.data || [])).filter(a => !a.source);
        const sessions = new Map();
        for (const a of all) {
            const pt = typeof a.passthrough === 'string' ? a.passthrough.trim() : '';
            let o = null; try { o = JSON.parse(pt); } catch (e) {}
            if (!o && pt.includes(' // ')) continue;   // older clip / audio / thumbnail labels: part of a session, not one
            const artist = String((o && o.artist) || pt || '').toUpperCase().trim();
            if (!artist || artist === 'SESSION_ARCHIVE') continue;
            const date = (o && o.date) || new Date(Number(a.created_at) * 1000).toISOString().slice(0, 10);
            const key = artist + '|' + date;
            if (!sessions.has(key)) sessions.set(key, { artist, date, master: null, cams: 0, edit: null, at: Number(a.created_at) });
            const cam = String((o && o.camera) || 'MASTER').toUpperCase();
            const hasVideo = !(a.tracks && a.tracks.length) || a.tracks.some(t => t.type === 'video');
            const sess = sessions.get(key);
            if (cam === 'EDIT' && hasVideo) sess.edit = a;   // the multi-camera edit is the session's long form
            else if (!SUB.has(cam) && hasVideo) { sess.cams++; if (!sess.master || Number(a.created_at) > Number(sess.master.created_at)) sess.master = a; }
            sess.at = Math.max(sess.at, Number(a.created_at));
        }
        const assets = [...sessions.values()].sort((x, y) => y.at - x.at).map(s => Object.assign({}, s.edit || s.master || { id: s.artist + s.date, status: 'no-master' }, { _artist: s.artist, _date: s.date, _cams: s.cams, _edit: !!s.edit }));
        if (assets.length === 0) {
            list.innerHTML = `<p class="text-zinc-500 font-mono text-[10px] uppercase">VAULT EMPTY // NO ASSETS FOUND</p>`;
            return;
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        window.vaultEsc = esc;
        function parsePT(pt, assetName) {
            if (pt && typeof pt === 'object') {
                if (pt.artist) return pt;
                pt = null;
            }
            if (pt && typeof pt === 'string' && pt.trim()) {
                try { const o = JSON.parse(pt); if (o && o.artist) return o; } catch(e) {}
                const upper = pt.toUpperCase().trim();
                if (upper !== 'SESSION_ARCHIVE' && upper !== 'UNKNOWN') {
                    return { artist: upper.split(' // ')[0].split(' — ')[0].trim(), date: null, camera: null };
                }
            }
            if (assetName && typeof assetName === 'string') {
                const n = assetName.toUpperCase().trim();
                const ap = (n.split(' — ')[0] || n.split(' - ')[0] || n).trim();
                if (ap && ap !== 'SESSION_ARCHIVE') return { artist: ap, date: null, camera: null };
            }
            return null; // assets.html uses asset.id.slice(-6) as fallback inline
        }

        list.innerHTML = assets.map((asset, i) => {
            const pid     = asset.playback_ids?.[0]?.id;
            const status  = asset.status;
            const isReady = status === 'ready';
            const saved   = (window._sessMeta || {})[asset._artist + '|' + asset._date] || {};
            const meta    = { artist: asset._artist, date: saved.date || asset._date, camera: [saved.venue, asset.status === 'no-master' ? 'NO 4K LONG FORM YET' : '4K LONG FORM'].filter(Boolean).join(' // ') };
            const title   = esc(saved.title ? saved.title.toUpperCase() : meta.artist) + (saved.title ? '<span class="vault-artist">' + esc(meta.artist) + '</span>' : '');
            const editBtn = `<div class="vault-actions"><button type="button" class="vault-edit" data-artist="${esc(asset._artist)}" data-date="${esc(asset._date)}" onclick="event.stopPropagation(); editVaultSession(this)">Edit</button>`
                + (asset._cams >= 2 ? `<button type="button" class="vault-edit vault-mc" data-artist="${esc(asset._artist)}" data-date="${esc(asset._date)}" onclick="event.stopPropagation(); openMulticam(this)">${asset._edit ? 'Multi-cam ✓' : 'Multi-cam edit'}</button>` : '') + '</div>';
            const sub     = meta && (meta.date || meta.camera)
                ? esc([meta.date, meta.camera].filter(Boolean).join(' // '))
                : esc(new Date(asset.created_at * 1000).toLocaleDateString());

            return `
            <div class="vault-card ${isReady ? '' : 'opacity-50'}" id="vault-${i}">
                <div class="vault-card-header" onclick="toggleVaultFolder(${i})">
                    ${editBtn}
                    <div>
                        <h4 class="text-2xl font-black italic uppercase">${title}</h4>
                        <p class="text-[8px] font-mono text-zinc-500 uppercase mt-0.5">${sub}</p>
                        <span class="text-[8px] font-mono ${isReady ? 'text-primary' : 'text-zinc-500'} uppercase">
                            ${esc(status === 'no-master' ? 'AUDIO / CLIPS ONLY' : status.toUpperCase())}
                        </span>
                    </div>
                    ${isReady ? `
                    ` : ''}
                </div>
                <div class="asset-tray">
                    <div class="flex gap-4 pt-4">
                        ${pid ? `<button class="px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-[9px] font-black hover:border-primary" 
                            onclick="event.stopPropagation(); showPreview('${pid}')">PLAY SESSION</button>` : ''}
                        <span class="px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-[9px] font-black text-primary">4K LONG FORM</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    } catch (e) {
        list.innerHTML = `<p class="text-red-500 font-mono text-[10px] uppercase">VAULT OFFLINE: ${e.message}</p>`;
    }
}

    window.showPreview = (pid) => {
        const display = document.getElementById('active-asset-display');
        document.getElementById('preview-container').classList.remove('hidden');
        display.innerHTML = `<iframe src="https://player.mux.com/${pid}" style="width:100%;border:none;aspect-ratio:16/9;" allowfullscreen></iframe>`;
        display.scrollIntoView({ behavior: 'smooth' });
    };

    // Edit a session's name, date and venue (the same details as the pencil in Distribution History)
    window.editVaultSession = (btn) => {
        const artist = btn.dataset.artist, date = btn.dataset.date;
        const saved = (window._sessMeta || {})[artist + '|' + date] || {};
        const e = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const m = document.createElement('div');
        m.className = 'vs-backdrop';
        m.innerHTML = `<form class="vs-panel" role="dialog" aria-modal="true">
            <p class="vs-title">Edit session</p><p class="vs-sub">${e(artist)}</p>
            <label>Session name<input name="title" maxlength="80" placeholder="e.g. Friday Night Session" value="${e(saved.title)}"><small>Leave empty to show the artist and date.</small></label>
            <label>Date<input name="date" type="text" value="${e(saved.date || date)}"><small>When the set happened.</small></label>
            <label>Venue<input name="venue" maxlength="60" placeholder="e.g. Venue Name" value="${e(saved.venue)}"></label>
            <p class="vs-error"></p>
            <div class="vs-actions"><button type="button" class="vs-btn ghost" data-cancel>Cancel</button><button type="submit" class="vs-btn primary">Save</button></div>
        </form>`;
        document.body.appendChild(m);
        const f = m.querySelector('form');
        if (window.flatpickr) flatpickr(f.date, Object.assign({}, window.LA_DATE_PICK || {}, { altInputClass: 'vs-date' }));
        const close = () => m.remove();
        m.addEventListener('click', ev => { if (ev.target === m) close(); });
        m.querySelector('[data-cancel]').onclick = close;
        f.title.focus();
        f.addEventListener('submit', async ev => {
            ev.preventDefault();
            const btnS = f.querySelector('[type=submit]'); btnS.disabled = true;
            try {
                const r = await laFetch('/api/session-meta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ artist, date, title: f.title.value, venue: f.venue.value, shownDate: f.date.value }) });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(d.error || r.status);
                close(); loadVault();
            } catch (er) { f.querySelector('.vs-error').textContent = 'Could not save: ' + er.message; btnS.disabled = false; }
        });
    };

    window.toggleVaultFolder = (i) => document.getElementById('vault-' + i).classList.toggle('expanded');
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .catch(err => console.warn('SW:', err));
        });
    }
</script>
<script>
    // Multi-camera edit: the session's cameras cut together on the HQ audio, rendered on the venue's Mac mini
    async function openMulticam(btn) {
        const artist = btn.dataset.artist, date = btn.dataset.date, e = window.vaultEsc;
        const m = document.createElement('div');
        m.className = 'vs-backdrop';
        m.innerHTML = '<div class="vs-panel" role="dialog" aria-modal="true"><p class="vs-title">Multi-camera edit</p><p class="vs-sub">' + e(artist) + ' · ' + e(date) + '</p><div id="mc-body"><p class="mc-note">Checking the session…</p></div>' +
            '<div class="vs-actions"><button type="button" class="vs-btn ghost" data-cancel>Close</button><button type="button" class="vs-btn primary" id="mc-start" hidden>Make the edit</button></div></div>';
        document.body.appendChild(m);
        let timer = null;
        const close = () => { clearTimeout(timer); m.remove(); };
        m.addEventListener('click', ev => { if (ev.target === m || ev.target.closest('[data-cancel]')) close(); });
        const q = '?artist=' + encodeURIComponent(artist) + '&date=' + encodeURIComponent(date);
        const show = d => {
            const body = m.querySelector('#mc-body'), start = m.querySelector('#mc-start');
            if (!body) return;
            const mins = s => Math.round(s / 60) + ' min';
            const cams = '<ul class="mc-cams">' + d.cameras.map(c => '<li>' + e(c.camera) + (c.main ? ' · main' : '') + '<span>' + mins(c.duration) + (c.hasAudio ? '' : ' · no sound') + '</span></li>').join('') +
                '<li>HQ audio from the console<span>' + (d.audio ? 'Ready' : 'None: the main camera\'s sound is used') + '</span></li></ul>';
            const mac = d.relay.online ? (d.relay.canRender ? 'The venue\'s Mac mini is online and ready.' : 'The Mac mini is online but needs ffmpeg: open Terminal on it and run <b>brew install ffmpeg</b>, then reinstall the relay from Camera Control.') : 'The venue\'s Mac mini is offline. The edit starts as soon as it is back online.';
            const j = d.job;
            let html = cams;
            if (j && j.status !== 'failed') {
                html += '<p class="mc-note" style="margin-top:12px">' + e(j.stage) + (j.status === 'done' ? '' : ' · ' + j.pct + '%') + '</p><div class="mc-bar"><i style="width:' + (j.status === 'done' ? 100 : j.pct) + '%"></i></div>' +
                    (j.warnings && j.warnings.length ? '<p class="mc-note" style="margin-top:8px">' + j.warnings.map(e).join('<br>') + '</p>' : '') +
                    (j.status === 'done' ? '<p class="mc-note" style="margin-top:8px">The edit appears as this session\'s long form when Mux has processed it; the vertical clips and thumbnails follow.</p>' : '');
            } else {
                html += '<p class="mc-note" style="margin-top:12px">Each camera is lined up with the ' + (d.audio ? 'HQ audio' : 'main camera\'s sound') + ', the shots change on the music\'s phrases, and the full set is rendered on the venue\'s Mac mini, then saved as this session\'s long form with its vertical clips.</p>' +
                    (j && j.status === 'failed' ? '<p class="vs-error" style="display:block">Last try failed: ' + e(j.message || j.stage) + '</p>' : '') +
                    '<p class="mc-note" style="margin-top:8px">' + mac + '</p>';
            }
            body.innerHTML = html;
            start.hidden = !!(j && !['done', 'failed'].includes(j.status)) || d.cameras.length < 2;
            start.textContent = j && j.status === 'done' ? 'Make it again' : 'Make the edit';
            if (j && ['queued', 'running'].includes(j.status)) timer = setTimeout(refresh, 8000);
        };
        const refresh = async () => {
            try { const r = await laFetch('/api/multicam' + q), d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); show(d); }
            catch (err) { const b = m.querySelector('#mc-body'); if (b) b.innerHTML = '<p class="vs-error" style="display:block">' + e(err.message) + '</p>'; }
        };
        m.querySelector('#mc-start').onclick = async function() {
            this.disabled = true;
            try {
                const r = await laFetch('/api/multicam', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', artist, date }) });
                const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); show(d);
            } catch (err) { laAlert('Could not start the edit: ' + err.message, { tone: 'error' }); }
            this.disabled = false;
        };
        refresh();
    }
</script>
