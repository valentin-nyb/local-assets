
<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <script>
      (function(){
        var s = localStorage.getItem('la_admin');
        if (!s) { window.location.replace('/login.html'); return; }
        try {
          var d = JSON.parse(s);
          if (!d.ts || Date.now() - d.ts > 10 * 60 * 1000) {
            localStorage.removeItem('la_admin');
            window.location.replace('/login.html');
          }
        } catch(e) {
          localStorage.removeItem('la_admin');
          window.location.replace('/login.html');
        }
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <script src="nav-component.js?v=2"></script>
    <style>
        .nav-link { font-family: 'JetBrains Mono', monospace !important; font-size: 12px !important; border-left: 2px solid transparent; }
        .nav-link.active { color: #39FF14 !important; background: rgba(57, 255, 20, 0.05); border-left: 2px solid #39FF14; }
        .nav-link:hover:not(.active) { background: rgba(255, 255, 255, 0.03); color: white; }
        body { background-color: #050505; color: #ffffff; -webkit-font-smoothing: antialiased; }
        .nav-link.active { background-color: rgba(255, 255, 255, 0.05); border: 1px solid #27272a; color: white; }
        ::-webkit-scrollbar { display: none; }
        @media (max-width: 767px) { #sidebar { position: fixed; z-index: 50; height: 100vh; } }
        .sleek-flap { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.3em; font-size: 10px; font-weight: 800; }
        .cam-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px; }
        @media (max-width: 640px) { .cam-grid { grid-template-columns:1fr; } }
        .cam-card { border:1px solid #27272a; background:#0a0a0a; border-radius:16px; overflow:hidden; }
        .cam-stage { aspect-ratio:16/9; background:#000; position:relative; }
        .cam-off { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#52525b; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.1em; text-align:center; padding:16px; }
        .cam-off iconify-icon { font-size:24px; }
        .cam-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; }
        .cam-label { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.15em; color:#d4d4d8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .cam-pill { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.15em; padding:3px 8px; border-radius:999px; border:1px solid #27272a; color:#71717a; flex-shrink:0; }
        .cam-pill.on { color:#fff; background:#ef4444; border-color:#ef4444; }
        .cam-empty { border:1px dashed #27272a; border-radius:16px; padding:48px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; }
        .cam-empty.hidden { display:none; }
        .cam-empty-title { font-size:14px; font-weight:600; color:#e4e4e7; }
        .cam-empty-text { font-size:12px; line-height:1.6; color:#71717a; max-width:380px; }
        html:not(.dark) .cam-card { background:#fff; border-color:#e4e4e7; }
        html:not(.dark) .cam-label, html:not(.dark) .cam-empty-title { color:#18181b; }
        html:not(.dark) .cam-empty { border-color:#d4d4d8; }
    </style>
</head>
<body class="font-sans antialiased bg-background text-foreground overflow-hidden h-screen w-screen flex selection:bg-primary selection:text-black">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/90 z-40 hidden backdrop-blur-md opacity-0 transition-opacity duration-300"></div>

    <aside id="sidebar" class="w-64 border-r border-[#27272a] bg-[#0a0a0a] flex flex-col transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 shrink-0 h-full"></aside>

    <main class="flex-1 flex flex-col overflow-hidden relative w-full bg-[#050505]">
        
        <header class="h-16 flex items-center px-4 md:px-8 border-b border-[#27272a] bg-[#050505] shrink-0 justify-between w-full z-40">
            <div class="flex items-center gap-2 md:gap-3 min-w-0"><button type="button" onclick="toggleSidebar()" class="la-menu-btn" aria-label="Open menu"><iconify-icon icon="solar:hamburger-menu-linear"></iconify-icon></button>
                <span id="venue-breadcrumb" class="text-zinc-600 text-[10px] font-mono uppercase tracking-[0.3em] hidden md:inline"></span>
                <iconify-icon icon="solar:alt-arrow-right-linear" class="text-zinc-700 hidden md:block"></iconify-icon>
                <h1 class="text-[10px] md:text-[10px] font-mono uppercase tracking-[0.2em] md:tracking-[0.3em] text-[#39FF14] font-bold m-0 truncate">
                    CAMERAS
                </h1>
            </div>
            <div class="flex items-center gap-4 shrink-0">
                <div class="hidden md:flex items-center gap-2 bg-[#0a0a0a] border border-[#27272a] px-3 py-1.5 rounded-md shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]">
                    <span id="cam-badge-dot" class="w-1.5 h-1.5 rounded-full bg-zinc-600"></span>
                    <span id="cam-badge" class="text-[9px] font-mono text-zinc-500 uppercase tracking-widest">Checking…</span>
                </div>
<button id="venue-avatar" onclick="openVenueEditor()" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center font-bold text-xs shrink-0 cursor-pointer hover:scale-105 transition-transform shadow-[0_0_10px_rgba(255,255,255,0.1)]" title="Change venue name"></button>
            </div>
        </header>

        <div class="flex-1 w-full overflow-y-auto no-scrollbar">
            <div class="max-w-6xl mx-auto w-full p-4 md:p-10 flex flex-col space-y-4 md:space-y-8 mt-2 md:mt-0">
                <div id="cam-grid" class="cam-grid"></div>
                <div id="cam-empty" class="hidden cam-empty">
                    <iconify-icon icon="solar:videocamera-record-linear" class="text-3xl text-zinc-600"></iconify-icon>
                    <p class="cam-empty-title">No cameras connected</p>
                    <p class="cam-empty-text">Cameras appear here as soon as they stream to this venue. Each camera needs its own stream set up in your account.</p>
                </div>
                <p id="cam-error" class="hidden text-center text-[10px] font-mono uppercase tracking-widest text-red-500"></p>
            </div>
        </div>

        <div class="la-statusbar w-full h-10 bg-black border-t border-[#27272a] flex items-center justify-between px-4 md:px-6 shrink-0">
            <div class="flex items-center gap-2 md:gap-4 text-[7px] md:text-[9px] font-mono text-zinc-600 uppercase tracking-widest">
                <span>LOCAL / ASSETS V2.4.0</span>
            </div>
            <div class="flex items-center gap-2">
                <span id="cam-foot-dot" class="w-1.5 h-1.5 rounded-full bg-zinc-600"></span>
                <span id="cam-foot" class="text-[7px] md:text-[9px] font-mono text-zinc-400 uppercase tracking-widest">Checking…</span>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // Cameras: the venue's Mux live streams (one per camera)
        function laFetch(url, opts) {
            var sess = {}; try { sess = JSON.parse(localStorage.getItem('la_admin') || '{}'); } catch (_) {}
            opts = Object.assign({}, opts); opts.headers = Object.assign({}, opts.headers);
            if (sess.webToken) opts.headers['Authorization'] = 'Bearer ' + sess.webToken;
            return fetch(url, opts);
        }
        function camStatus(text, color) {
            [['cam-badge', 'cam-badge-dot'], ['cam-foot', 'cam-foot-dot']].forEach(function(ids) {
                var t = document.getElementById(ids[0]), d = document.getElementById(ids[1]);
                if (t) { t.textContent = text; if (ids[0] === 'cam-badge') t.style.color = color; }
                if (d) { d.style.background = color; d.style.boxShadow = '0 0 8px ' + color; }
            });
        }
        var _camKey = '';
        async function loadCameras() {
            var grid = document.getElementById('cam-grid');
            var empty = document.getElementById('cam-empty');
            var err = document.getElementById('cam-error');
            try {
                var res = await laFetch('/api/live-streams');
                var data = await res.json();
                if (!res.ok) throw new Error(data.error || res.status);
                var streams = data.streams || [];
                err.classList.add('hidden');
                empty.classList.toggle('hidden', streams.length > 0);
                var live = streams.filter(function(s) { return s.status === 'active'; }).length;
                camStatus(streams.length ? live + ' of ' + streams.length + ' live' : 'No cameras', live ? '#39FF14' : '#71717a');

                // Only rebuild when something changed, so playing video isn't interrupted
                var key = streams.map(function(s) { return s.id + ':' + s.status; }).join('|');
                if (key === _camKey) return;
                _camKey = key;
                grid.innerHTML = '';
                streams.forEach(function(s, i) {
                    var card = document.createElement('div');
                    card.className = 'cam-card';
                    var label = 'CAM ' + String(i + 1).padStart(2, '0') + (s.name ? ' // ' + s.name : '');
                    var isLive = s.status === 'active' && s.playbackId;
                    card.innerHTML =
                        '<div class="cam-stage"></div>' +
                        '<div class="cam-meta"><span class="cam-label"></span>' +
                        '<span class="cam-pill ' + (isLive ? 'on' : '') + '">' + (isLive ? 'LIVE' : 'OFFLINE') + '</span></div>';
                    card.querySelector('.cam-label').textContent = label;
                    var stage = card.querySelector('.cam-stage');
                    if (isLive) {
                        var mp = document.createElement('mux-player');
                        mp.setAttribute('stream-type', 'live');
                        mp.setAttribute('playback-id', s.playbackId);
                        mp.setAttribute('muted', '');
                        mp.setAttribute('autoplay', 'muted');
                        mp.setAttribute('accent-color', '#39FF14');
                        mp.style.cssText = 'width:100%;height:100%;--media-object-fit:cover;';
                        stage.appendChild(mp);
                    } else {
                        stage.innerHTML = '<div class="cam-off"><iconify-icon icon="solar:videocamera-slash-linear"></iconify-icon><span>Waiting for the camera to start streaming</span></div>';
                    }
                    grid.appendChild(card);
                });
            } catch (e) {
                err.textContent = 'Could not load cameras — ' + e.message;
                err.classList.remove('hidden');
                camStatus('Unavailable', '#ef4444');
            }
        }
        loadCameras();
        setInterval(loadCameras, 15000);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch(err => console.warn('SW:', err));
            });
        }
    </script>
</body>
