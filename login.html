<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>local / assets™ — Sign In</title>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        if (new URLSearchParams(location.search).get('clear') === '1') {
            localStorage.removeItem('la_admin');
        }
        (function() {
            if (new URLSearchParams(location.search).get('_s')) return;
            try {
                var d = JSON.parse(localStorage.getItem('la_admin') || 'null');
                if (d && d.ts && Date.now() - d.ts < 600000) {
                    var nx = new URLSearchParams(location.search).get('next') || '/dashboard.html';
                    if (nx.startsWith('/')) window.location.replace(nx);
                }
            } catch(e) {}
        })();
    </script>
    <script>(function(){var t=localStorage.getItem('la_theme');if(t==='light')document.documentElement.classList.add('light');else if(t==='auto'&&window.matchMedia('(prefers-color-scheme:light)').matches)document.documentElement.classList.add('light');})()</script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green:   #39FF14;
            --bg:      #050505;
            --fg:      #ffffff;
            --border:  rgba(255,255,255,0.14);
            --btn-bg:  #0a0a0a;
            --mono:    'JetBrains Mono', ui-monospace, 'Courier New', monospace;
            --display: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --safe-top:    env(safe-area-inset-top,    0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html.light {
            --green:  #F97316;
            --bg:     #f5f5f4;
            --fg:     #18181b;
            --border: rgba(0,0,0,0.12);
            --btn-bg: #ffffff;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
            font-family: var(--mono);
        }

        body {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* Dot grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(128,128,128,0.15) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        /* Scanlines — dark only */
        html:not(.light) body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 3px,
                rgba(0,0,0,0.18) 3px,
                rgba(0,0,0,0.18) 4px
            );
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(57,255,20,0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        html.light .bg-glow {
            background: radial-gradient(circle, rgba(0,0,0,0.06) 0%, transparent 70%);
        }

        .wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: max(var(--safe-top), 40px) 32px max(var(--safe-bottom), 40px);
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        /* ── Brand label row ── */
        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            flex-shrink: 0;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
            50%       { opacity: 0.6; box-shadow: 0 0 4px var(--green); }
        }
        .brand-label {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--green);
        }

        /* ── Hero title ── */
        h1 {
            font-family: var(--display);
            font-size: clamp(44px, 9vw, 76px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            line-height: 0.88;
            color: #fff;
            margin-bottom: 48px;
        }
        html.light h1 { color: #F97316; }

        /* ── Google button ── */
        #google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            background: var(--btn-bg);
            border: 1px solid var(--border);
            color: var(--fg);
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            margin-bottom: 16px;
            border-radius: 0;
            -webkit-appearance: none;
        }
        #google-btn:hover:not(.loading) {
            border-color: rgba(57,255,20,0.5);
            background: rgba(57,255,20,0.03);
        }
        #google-btn:active:not(.loading) { transform: scale(0.99); }
        #google-btn.loading { opacity: 0.5; pointer-events: none; }
        #google-btn svg { flex-shrink: 0; }

        /* ── Status ── */
        #status {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-align: center;
            min-height: 14px;
            color: #52525b;
        }
        #status.err { color: #ef4444; }
        #status.ok  { color: var(--green); }

        /* ── Footer ── */
        .footer-note {
            position: fixed;
            bottom: max(var(--safe-bottom), 24px);
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #888888;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-glow" aria-hidden="true"></div>

    <div class="wrap">
        <div class="brand-row">
            <div class="pulse-dot"></div>
            <span class="brand-label">LOCAL / ASSETS™</span>
        </div>

        <h1>SIGN IN TO<br>YOUR WORKSPACE</h1>

        <button id="google-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                <path d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            CONTINUE WITH GOOGLE
        </button>

        <div id="status"></div>
    </div>

    <p class="footer-note">Unauthorized access is prohibited</p>

    <script>
        function setStatus(msg, cls) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = cls || '';
        }

        // Handle OAuth return: /login.html?_s=TOKEN or /login.html?err=... or ?error=...
        (function() {
            var params = new URLSearchParams(location.search);
            var token  = params.get('_s');
            var err    = params.get('err') || params.get('error');

            if (err) {
                var msgs = {
                    not_allowed:  'Access denied — account not authorized',
                    unauthorized: 'Access denied — account not authorized',
                    cancelled:    'Sign-in cancelled',
                    auth_failed:  'Authentication failed — try again',
                    no_email:     'Could not read email from Google',
                };
                setStatus(msgs[err] || 'Authentication failed — try again', 'err');
                history.replaceState({}, '', '/login.html');
                return;
            }

            if (!token) return;

            setStatus('Verifying…', '');
            document.getElementById('google-btn').classList.add('loading');

            var next = sessionStorage.getItem('la_pending_next') || '/dashboard.html';
            sessionStorage.removeItem('la_pending_next');

            fetch('/api/admin-finalize', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ token: token }),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.ok) {
                    setStatus('Session expired — please sign in again', 'err');
                    history.replaceState({}, '', '/login.html');
                    document.getElementById('google-btn').classList.remove('loading');
                    return;
                }
                localStorage.setItem('la_admin', JSON.stringify({
                    email:    data.email,
                    name:     data.name,
                    picture:  data.picture,
                    venue:    (data.venue || '').toUpperCase(),
                    role:     data.role || 'admin',
                    webToken: data.webToken || '',
                    ts:       Date.now(),
                }));
                if (data.venue) localStorage.setItem('la_venue_name', data.venue.toUpperCase());
                localStorage.removeItem('la_revenue_cache');
                setStatus('Signed in — redirecting…', 'ok');
                window.location.replace(next.startsWith('/') ? next : '/dashboard.html');
            })
            .catch(function() {
                setStatus('Network error — try again', 'err');
                history.replaceState({}, '', '/login.html');
                document.getElementById('google-btn').classList.remove('loading');
            });
        })();

        document.getElementById('google-btn').addEventListener('click', function() {
            var next = new URLSearchParams(location.search).get('next') || '/dashboard.html';
            sessionStorage.setItem('la_pending_next', next);
            this.classList.add('loading');
            window.location.href = '/api/google-auth?mode=web';
        });
    </script>
</body>
</html>
