<!DOCTYPE html>
<html lang="en" style="color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>local / assets™ — Log in</title>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico?v=4">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=4">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/favicon/site.webmanifest?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        if (new URLSearchParams(location.search).get('clear') === '1') {
            localStorage.removeItem('la_admin');
        }
        (function() {
            if (new URLSearchParams(location.search).get('_s')) return;
            try {
                var d = JSON.parse(localStorage.getItem('la_admin') || 'null');
                if (d && d.ts && Date.now() - d.ts < 600000) {
                    var nx = new URLSearchParams(location.search).get('next') || '/dashboard.html';
                    if (/^\/(?![\/\\])/.test(nx)) window.location.replace(nx);
                }
            } catch(e) {}
        })();
    </script>
    <!-- The sign-in page is always dark, whatever theme the dashboard uses -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green: #39FF14;
            --bg: #070905;
            --fg: #fafafa;
            --mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
            --display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --col: min(100vw - 48px, 440px);
            --gut: 24px;
        }
        html, body { height: 100%; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; font-family: var(--display); }
        body { position: relative; min-height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
               padding: max(env(safe-area-inset-top), 40px) 0 max(env(safe-area-inset-bottom), 40px); }

        /* Faint dot grid that lights up around the pointer */
        .dot-grid-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

        .wrap { position: relative; z-index: 1; width: var(--col); display: flex; flex-direction: column; align-items: flex-start; }

        /* The wordmark, top left, a calm size */
        .wordmark { position: fixed; top: calc(env(safe-area-inset-top) + 40px); left: 24px; width: 184px; aspect-ratio: 1328 / 165;
                    background: url(/logos/White@2x.png) left center / contain no-repeat; }

        .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #7c8178; margin-bottom: 18px; }
        h1 .l1, h1 .l2 { display:block; width:max-content; white-space:nowrap; }
        h1 .l2 { line-height:.9; }
        h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 8.6vw, 44px); line-height: .96; letter-spacing: -0.02em; text-transform: uppercase; color: var(--fg); }
        h1 span { display: inline-block; white-space: nowrap; cursor: default; }
        /* Hover: LOG IN turns green, then WORKSPACE™ (TO YOUR stays as it is; nothing moves) */
        h1 .g { transition: color .3s; }
        h1 .l2.g { transition-delay: 0s; }
        /* Hovering the title turns only LOG IN green */
        @media (hover: hover) { h1:hover .l1 .g { color: var(--green); } }
        .lead { margin-top: 16px; font-size: 15px; line-height: 1.5; color: #a1a1aa; }

        /* Continue with Google: a pill in the platform style, green slides in on hover */
        #google-btn { position: relative; isolation: isolate; overflow: hidden; margin-top: 36px;
                      display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 54px;
                      background: #fafafa; border: 1px solid #fafafa; border-radius: 999px; color: #0a0a0a;
                      font: 500 15px/1 var(--display); letter-spacing: 0; cursor: pointer; -webkit-appearance: none;
                      transition: transform .15s ease, border-color .3s ease; }
        #google-btn::before { content: ""; position: absolute; inset: -1px; z-index: -1; border-radius: inherit; background: var(--green);
                              transform: scaleX(0); transform-origin: right center; transition: transform .42s cubic-bezier(.65, 0, .35, 1); pointer-events: none; }
        @media (hover: hover) { #google-btn:hover:not(.loading)::before { transform: scaleX(1); transform-origin: left center; }
                                #google-btn:hover:not(.loading) { border-color: var(--green); } }
        #google-btn:active:not(.loading) { transform: scale(.98); }
        #google-btn.loading { opacity: .55; pointer-events: none; }
        #google-btn .g { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #google-btn svg { width: 18px; height: 18px; }

        .terms { margin-top: 16px; font-size: 12px; line-height: 1.5; color: #71717a; }
        .terms a, .foot a { color: #a1a1aa; text-decoration: underline; text-underline-offset: 2px; }

        #status { margin-top: 14px; min-height: 18px; font-size: 13px; line-height: 1.4; color: #a1a1aa; }
        #status.err { color: #ef4444; }
        #status.ok  { color: var(--green); }

        .foot { position: fixed; left: 0; right: 0; bottom: calc(max(env(safe-area-inset-bottom), 12px) + 18px); text-align: center;
                font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #52564f; z-index: 1; }
        .foot a { font-family: var(--mono); color: #7c8178; }

        @media (min-width: 980px) {
            :root { --col: 420px; }
            .wordmark { top: 40px; left: 24px; }
            h1 { font-size: 50px; }
            .foot { bottom: 32px; }
        }
    </style>
</head>
<body>

    <canvas class="dot-grid-canvas" aria-hidden="true"></canvas>

    <span class="wordmark" role="img" aria-label="local / assets"></span>

    <main class="wrap">
        <p class="eyebrow">Welcome back</p>
        <h1 id="lg-title"><span class="l1"><span class="g">Log in</span> to your</span><span class="l2 g">Workspace™</span></h1>
        <script>
            // The second line is drawn at the size that makes it exactly as wide as the first
            (function() {
                var h = document.getElementById('lg-title'), a = h.querySelector('.l1'), b = h.querySelector('.l2');
                function fit() { b.style.fontSize = ''; var w1 = a.getBoundingClientRect().width, w2 = b.getBoundingClientRect().width; if (w1 && w2) b.style.fontSize = (parseFloat(getComputedStyle(b).fontSize) * w1 / w2) + 'px'; }
                fit();
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
                window.addEventListener('resize', fit);
            })();
        </script>
        <p class="lead">Your sessions, brand kit and channels, in one place.</p>

        <button id="google-btn" type="button">
            <span class="g"><svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                <path d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg></span>
            Continue with Google
        </button>

        <div id="status" role="status"></div>
        <p class="terms">Only invited accounts can sign in. See our <a href="/privacy">privacy policy</a>.</p>
    </main>

    <p class="foot">© 2026 local / assets™</p>


    <script>
        function setStatus(msg, cls) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = cls || '';
        }

        // Handle OAuth return: /login.html?_s=TOKEN or /login.html?err=... or ?error=...
        (function() {
            var params = new URLSearchParams(location.search);
            var token  = params.get('_s');
            var err    = params.get('err') || params.get('error');

            if (err) {
                var msgs = {
                    not_allowed:  'Access denied — account not authorized',
                    unauthorized: 'Access denied — account not authorized',
                    cancelled:    'Sign-in cancelled',
                    auth_failed:  'Authentication failed — try again',
                    no_email:     'Could not read email from Google',
                };
                setStatus(msgs[err] || 'Authentication failed — try again', 'err');
                history.replaceState({}, '', '/login.html');
                return;
            }

            if (!token) return;

            setStatus('Verifying…', '');
            document.getElementById('google-btn').classList.add('loading');

            var next = sessionStorage.getItem('la_pending_next') || '/dashboard.html';
            sessionStorage.removeItem('la_pending_next');

            fetch('/api/admin-finalize', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ token: token }),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.ok) {
                    setStatus('Session expired — please sign in again', 'err');
                    history.replaceState({}, '', '/login.html');
                    document.getElementById('google-btn').classList.remove('loading');
                    return;
                }
                localStorage.setItem('la_admin', JSON.stringify({
                    email:    data.email,
                    name:     data.name,
                    picture:  data.picture,
                    venue:    (data.venue || '').toUpperCase(),
                    venueSlug: data.venueSlug || '',
                    venues:   data.venues || [],
                    role:     data.role || 'admin',
                    webToken: data.webToken || '',
                    ts:       Date.now(),
                }));
                if (data.venue) localStorage.setItem('la_venue_name', data.venue.toUpperCase());
                localStorage.removeItem('la_revenue_cache_v2');
                setStatus('Signed in — redirecting…', 'ok');
                window.location.replace(/^\/(?![\/\\])/.test(next) ? next : '/dashboard.html');
            })
            .catch(function() {
                setStatus('Network error — try again', 'err');
                history.replaceState({}, '', '/login.html');
                document.getElementById('google-btn').classList.remove('loading');
            });
        })();

        document.getElementById('google-btn').addEventListener('click', function() {
            var next = new URLSearchParams(location.search).get('next') || '/dashboard.html';
            sessionStorage.setItem('la_pending_next', next);
            // A new sign-in replaces any saved session: you're signed in as the Google account you pick, nothing else
            try { localStorage.removeItem('la_admin'); localStorage.removeItem('la_venue_name'); } catch (_) {}
            // In the Mac app (a™), Google sign-in opens in the browser and the app picks the session up
            if (window.laApp && window.laApp.signIn) {
                setStatus('Continue in your browser…', '');
                window.laApp.signIn();
                return;
            }
            this.classList.add('loading');
            // On the local dev server (npm run dev), sign in on the live site and come back here
            var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
            window.location.href = local ? 'https://local-assets.com/api/google-auth?mode=web&dev=' + (location.port || '80') : '/api/google-auth?mode=web';
        });
    </script>

    <script src="/la-native.js?v=1"></script>
    <script>
        // Dot grid that lights up around the pointer, as on the home page hero
        (function () {
            var canvas = document.querySelector('.dot-grid-canvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d'), dots = [], mouse = { x: -1000, y: -1000 };
            var SPACING = 45, DOT_SIZE = 1.1, GLOW_RADIUS = 120, ACTIVE = '57, 255, 20';
            function init() {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight; dots = [];
                for (var x = SPACING / 2; x < canvas.width; x += SPACING)
                    for (var y = SPACING / 2; y < canvas.height; y += SPACING) dots.push({ x: x, y: y });
            }
            function draw() {
                var idle = '#141a11';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = 0; i < dots.length; i++) {
                    var d = dots[i], dx = mouse.x - d.x, dy = mouse.y - d.y, dist = Math.sqrt(dx * dx + dy * dy);
                    ctx.fillStyle = dist < GLOW_RADIUS ? 'rgba(' + ACTIVE + ',' + (1 - dist / GLOW_RADIUS) + ')' : idle;
                    ctx.beginPath(); ctx.arc(d.x, d.y, dist < GLOW_RADIUS ? DOT_SIZE + 0.5 : DOT_SIZE, 0, Math.PI * 2); ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            window.addEventListener('mousemove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('touchmove', function (e) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: true });
            window.addEventListener('touchend', function () { mouse.x = -1000; mouse.y = -1000; });
            window.addEventListener('resize', init);
            init(); draw();
        })();
    </script>
</body>
</html>
