      (function(){
        var s = localStorage.getItem('la_admin');
        if (!s) { window.location.replace('/login.html'); return; }
        try {
          var d = JSON.parse(s);
          if (!d.ts || Date.now() - d.ts > 10 * 60 * 1000) {
            localStorage.removeItem('la_admin');
            window.location.replace('/login.html');
          }
        } catch(e) {
          localStorage.removeItem('la_admin');
          window.location.replace('/login.html');
        }
      })();

<body class="font-sans antialiased bg-background text-foreground overflow-hidden h-screen w-screen flex selection:bg-primary selection:text-black">

    <aside id="sidebar" class="w-64 border-r border-[#27272a] bg-[#0a0a0a] flex flex-col transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 shrink-0 h-full"></aside>
    <main class="flex-1 flex flex-col overflow-hidden relative w-full bg-[#050505]">
        <header class="la-topbar h-16 flex items-center px-4 md:px-8 border-b border-[#27272a] bg-[#050505] shrink-0 justify-between w-full z-40">
            <div class="flex items-center gap-2 md:gap-3 min-w-0"><button type="button" onclick="toggleSidebar()" class="la-menu-btn" aria-label="Open menu"><iconify-icon icon="solar:hamburger-menu-linear"></iconify-icon></button>
                <span id="venue-breadcrumb" class="text-zinc-600 text-[10px] font-mono uppercase tracking-[0.3em] hidden md:inline"></span>
                <h1 class="text-[10px] font-mono uppercase tracking-[0.2em] md:tracking-[0.3em] text-[#39FF14] font-bold m-0 truncate">ACCOUNTS</h1>
            </div>
            <div class="flex items-center gap-4 shrink-0">
                <button id="venue-avatar" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center font-bold text-xs shrink-0"></button>
            </div>

        <div class="flex-1 w-full overflow-y-auto no-scrollbar">

                    <p class="ac-eyebrow">Admin</p>

    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar'), overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); setTimeout(function() { overlay.classList.add('opacity-100'); }, 10); }
            else { sidebar.classList.add('-translate-x-full'); overlay.classList.add('opacity-0'); setTimeout(function() { overlay.classList.add('hidden'); }, 300); }
        }
        function laFetch(url, opts) {
            var sess = {}; try { sess = JSON.parse(localStorage.getItem('la_admin') || '{}'); } catch (_) {}
            opts = Object.assign({}, opts); opts.headers = Object.assign({}, opts.headers);
            if (sess.webToken) opts.headers['Authorization'] = 'Bearer ' + sess.webToken;
            return fetch(url, opts);
        }
        function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        (function() {
            try { var s = JSON.parse(localStorage.getItem('la_admin') || '{}'); var v = (s.venue || '').toUpperCase();
                document.getElementById('venue-breadcrumb').textContent = v; document.getElementById('venue-avatar').textContent = (v || '?').charAt(0); } catch (_) {}
        })();
        // What Resend says happened to the email, in plain words
        function deliveryText(status, domain) {
            var dom = domain === 'verified' ? '' : domain === 'missing' ? ' The sending domain isn\'t set up in Resend, so inboxes may refuse it.' : domain ? ' The sending domain is "' + esc(domain) + '" in Resend, not verified: inboxes may refuse it.' : '';
            var t = {
                delivered: '<b>Delivered</b>: it reached the inbox server. Look in Spam or Promotions if it isn\'t in the inbox.',
                bounced: '<b>Bounced</b>: the address refused it. Check the address, or remove it from Resend → Suppressions.',
                complained: '<b>Marked as spam</b> by the recipient before. Remove it from Resend → Suppressions.',
                delivery_delayed: '<b>Delayed</b>: the inbox is holding it. Check again in a few minutes.',
                failed: '<b>Failed</b>: Resend couldn\'t send it.',
                suppressed: '<b>Suppressed</b>: Resend blocks this address after an earlier bounce or spam report. Remove it from Resend → Suppressions.',
                sent: '<b>Sent</b>, waiting for the inbox to answer.', queued: '<b>Queued</b> at Resend.'
            }[status] || 'Delivery not known yet.';
            return t + dom;
        }
        function post(body) {
            return laFetch('/api/admin-accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                .then(function(r) { return r.json().catch(function() { return {}; }).then(function(d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); });
        }
        var day = function(ms) { return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };

        var _accounts = [];
        async function load() {
            var list = document.getElementById('ac-list');
            try {
                var r = await laFetch('/api/admin-accounts?t=' + Date.now());
                var d = await r.json();
                if (!r.ok) throw new Error(d.error || r.status);
                _accounts = d.accounts || [];
                render();
            } catch (e) { list.innerHTML = '<p class="ac-empty">' + esc(e.message) + '</p>'; }
        }
        function chips(a) {
            var c = [];
            if (a.paused) c.push(['bad', 'Paused']);
            else if (a.unpaid.length) c.push(['bad', 'Unpaid ' + a.unpaid.join(', ')]);
            else if (a.setupPending) c.push(['warn', 'Setting up']);
            else c.push(['ok', 'Active']);
            if (a.discount) c.push(['ok', a.discount + '% off usage']);
            if (a.endsAt) c.push(['warn', 'Plan ends ' + day(a.endsAt)]);
            else if (a.subscription === 'canceled') c.push(['bad', 'Plan cancelled']);
            else if (a.subscription === 'past_due' || a.subscription === 'unpaid') c.push(['bad', 'Payment ' + a.subscription.replace('_', ' ')]);
            else if (a.subscription === 'none') c.push(['', 'No Stripe plan']);
            return c.map(function(x) { return '<span class="ac-chip ' + x[0] + '">' + esc(x[1]) + '</span>'; }).join('');
        }
        function render() {
            var q = document.getElementById('ac-q').value.trim().toLowerCase();
            var rows = _accounts.filter(function(a) { return !q || (a.name + ' ' + a.slug + ' ' + a.email + ' ' + a.type).toLowerCase().indexOf(q) >= 0; });
            document.getElementById('ac-count').textContent = rows.length + ' of ' + _accounts.length + ' accounts';
            var list = document.getElementById('ac-list');
            if (!rows.length) { list.innerHTML = '<p class="ac-empty">' + (_accounts.length ? 'No account matches.' : 'No client accounts yet.') + '</p>'; return; }
            list.innerHTML = rows.map(function(a) {
                var live = a.subscription && a.subscription !== 'none' && a.subscription !== 'canceled' && a.subscription !== 'unknown';
                return '<div class="ac-row" data-slug="' + esc(a.slug) + '">' +
                    '<div style="min-width:0"><p class="ac-name">' + esc(a.name) + '</p>' +
                        '<p class="ac-meta">' + esc([a.type, a.plan || 'No plan', a.email, a.artists ? a.artists + ' artist login' + (a.artists !== 1 ? 's' : '') : ''].filter(Boolean).join(' · ')) + '</p></div>' +
                    '<div class="ac-chips">' + chips(a) + '</div>' +
                    '<div class="ac-actions">' +
                        '<button type="button" class="ac-btn" data-act="edit">Edit</button>' +
                        '<button type="button" class="ac-btn" data-act="logins">Logins' + ((a.logins || []).length ? ' ' + a.logins.length : '') + '</button>' +
                        '<button type="button" class="ac-btn' + (a.videoQuality === 'premium' ? ' is-premium' : '') + '" data-act="quality" aria-pressed="' + (a.videoQuality === 'premium') + '" title="Quality of the account\'s new videos in Mux. Basic is free to encode; Premium costs local / assets about $0.04 a minute">' + (a.videoQuality === 'premium' ? 'Premium video' : 'Basic video') + '</button>' +
                        '<button type="button" class="ac-btn" data-act="discount">' + (a.discount ? 'Discount ' + a.discount + '%' : 'Discount') + '</button>' +
                        '<button type="button" class="ac-btn" data-act="' + (a.paused ? 'resume' : 'pause') + '">' + (a.paused ? 'Resume' : 'Pause') + '</button>' +
                        (live ? '<button type="button" class="ac-btn" data-act="' + (a.endsAt ? 'keep' : 'cancel') + '">' + (a.endsAt ? 'Keep plan' : 'Cancel plan') + '</button>' : '') +
                        '<button type="button" class="ac-btn danger" data-act="delete">Delete</button>' +
                    '</div></div>';
            }).join('');
        }
        document.getElementById('ac-q').addEventListener('input', render);
        document.getElementById('ac-list').addEventListener('click', async function(e) {
            var b = e.target.closest('[data-act]'); if (!b) return;
            var row = b.closest('[data-slug]'), slug = row.dataset.slug, a = _accounts.filter(function(x) { return x.slug === slug; })[0];
            var act = b.dataset.act;
            if (act === 'delete') return openDelete(a);
            if (act === 'logins') return openLogins(a);
            if (act === 'edit') return openEdit(a);
            if (act === 'discount') return openDiscount(a);
            if (act === 'quality') {
                var prem = a.videoQuality !== 'premium';
                if (prem && !(await laConfirm({ title: 'Premium video for ' + a.name + '?', message: 'Its new videos are encoded at Premium quality: sharper, with more streaming sizes. Mux charges about $0.04 a minute of video for it; Basic is free. Videos already uploaded stay as they are.', confirmText: 'Use Premium' }))) return;
                b.disabled = true;
                try { await post({ action: 'videoQuality', slug: slug, quality: prem ? 'premium' : 'basic' }); laToast(a.name + ': ' + (prem ? 'Premium' : 'Basic') + ' video for new uploads'); await load(); }
                catch (er) { b.disabled = false; laAlert('Could not change the video quality: ' + er.message, { tone: 'error' }); }
                return;
            }
            var ask = {
                pause: { title: 'Pause ' + a.name + '?', message: 'Uploads, vertical clips, watermarks, recording and publishing stop, and the account sees a banner saying local / assets paused it. Everything is kept; resume it any time.', confirmText: 'Pause account', danger: true },
                resume: { title: 'Resume ' + a.name + '?', message: 'The account works again straight away.', confirmText: 'Resume account' },
                cancel: { title: 'Cancel ' + a.name + '\'s plan?', message: 'No more monthly charges after the paid month ends (or its 12-month minimum, if it has one). The account keeps working until then.', confirmText: 'Cancel plan', danger: true },
                keep: { title: 'Keep ' + a.name + '\'s plan?', message: 'The cancellation is withdrawn and the plan carries on as before.', confirmText: 'Keep plan' },
            }[act];
            if (!(await laConfirm(ask))) return;
            b.disabled = true; var t = b.textContent; b.textContent = '…';
            try {
                var d = await post({ action: act, slug: slug });
                laToast({ pause: a.name + ' is paused', resume: a.name + ' is running again', cancel: a.name + '\'s plan ends ' + (d.endsAt ? day(d.endsAt) : 'at the end of the month'), keep: a.name + '\'s plan carries on' }[act]);
                await load();
            } catch (er) { b.disabled = false; b.textContent = t; laAlert('Could not ' + act + ' ' + a.name + ': ' + er.message, { tone: 'error' }); }
        });

        // A new client account, set up in one go: its login emails sign in with Google, it gets the next ready
        // video storage (Billing → Ready video storage), an optional plan billed monthly, and the welcome email
        document.getElementById('ac-new').addEventListener('click', openNew);
        var _plans = null;
        function openNew() {
            var m = document.createElement('div');
            m.className = 'ac-back';
            m.innerHTML = '<form class="ac-panel ac-new" role="dialog" aria-modal="true" aria-labelledby="ac-nt" autocomplete="off">' +
                '<h3 id="ac-nt">New account</h3>' +
                '<p>Opens the account straight away on the next ready video storage. Everyone listed signs in with Google.</p>' +
                '<label class="ac-f">Account name<input name="name" maxlength="60" required placeholder="Cafe 1001"></label>' +
                '<label class="ac-f">Type<select name="type"><option value="venue">Venue</option><option value="artist">Artist</option><option value="label">Record label</option><option value="management">Management</option></select></label>' +
                '<label class="ac-f">Login emails<input name="emails" required placeholder="owner@venue.com, manager@venue.com"></label>' +
                '<label class="ac-f">Plan<select name="plan"><option value="">No plan yet (free until one is given)</option></select></label>' +
                '<label class="ac-check"><input type="checkbox" name="welcome" checked> Send the welcome email to each login</label>' +
                '<p class="ac-err"></p>' +
                '<div class="ac-bar"><button type="button" class="ac-btn" data-cancel>Cancel</button><button type="submit" class="ac-btn primary-acc">Create account</button></div>' +
            '</form>';
            document.body.appendChild(m);
            var f = m.querySelector('form'), err = f.querySelector('.ac-err'), go = f.querySelector('[type=submit]');
            var close = function() { m.remove(); document.removeEventListener('keydown', onKey); };
            var onKey = function(e) { if (e.key === 'Escape') close(); };
            document.addEventListener('keydown', onKey);
            m.addEventListener('click', function(e) { if (e.target === m) close(); });
            f.querySelector('[data-cancel]').onclick = close;
            f.name.focus();
            // The plans at this type's prices
            var paintPlans = function() {
                if (!_plans) return;
                var t = f.type.value === 'management' ? 'label' : f.type.value, cur = f.plan.value;
                var price = {}; ((_plans.byType || {})[t] || []).forEach(function(p) { price[p.id] = p.price; });
                f.plan.innerHTML = '<option value="">No plan yet (free until one is given)</option>' + (_plans.plans || []).map(function(p) {
                    var pr = price[p.id] != null ? price[p.id] : p.price;
                    return '<option value="' + esc(p.id) + '"' + (p.id === cur ? ' selected' : '') + '>' + esc(p.name) + ' · ' + (pr > 0 ? '£' + pr.toLocaleString('en-GB') + ' a month' : 'pay as you go') + '</option>';
                }).join('');
            };
            (_plans ? Promise.resolve(_plans) : fetch('/api/plans').then(function(r) { return r.json(); })).then(function(d) { _plans = d; paintPlans(); }).catch(function() {});
            f.type.addEventListener('change', paintPlans);
            f.onsubmit = async function(e) {
                e.preventDefault();
                go.disabled = true; go.textContent = 'Setting up…'; err.textContent = '';
                try {
                    var r = await laFetch('/api/billing', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'openAccount', name: f.name.value.trim(), type: f.type.value, emails: f.emails.value, plan: f.plan.value, welcome: f.welcome.checked }) });
                    var d = await r.json().catch(function() { return {}; });
                    if (!r.ok) throw new Error(d.error || r.status);
                    close();
                    laAlert(d.waiting
                        ? f.name.value.trim() + ' is set up, but there is no ready video storage left: it can sign in, and recordings start once you add storage in Billing → Ready video storage.'
                        : f.name.value.trim() + ' is live on its own video storage (' + d.label + '). ' + (d.welcomed ? 'The welcome email went to ' + d.welcomed + (d.welcomed > 1 ? ' logins.' : ' login.') : f.welcome.checked ? 'The welcome email could not be sent.' : 'No welcome email sent.'),
                        { title: 'Account created', tone: d.waiting ? 'info' : 'ok' });
                    load();
                } catch (er) { go.disabled = false; go.textContent = 'Create account'; err.textContent = 'Could not create it: ' + er.message; }
            };
        }

        // Accounts → Edit: name, type, plan (unless it's billed through Stripe) and the billing email
        function openEdit(a) {
            var billed = a.subscription && a.subscription !== 'none';
            var m = document.createElement('div');
            m.className = 'ac-back';
            m.innerHTML = '<form class="ac-panel ac-new" role="dialog" aria-modal="true" aria-labelledby="ac-et" autocomplete="off">' +
                '<h3 id="ac-et">Edit ' + esc(a.name) + '</h3>' +
                '<label class="ac-f">Account name<input name="name" maxlength="60" required></label>' +
                '<label class="ac-f">Type<select name="type"><option value="venue">Venue</option><option value="artist">Artist</option><option value="label">Record label</option><option value="management">Management</option></select></label>' +
                '<label class="ac-f">Plan<select name="plan"' + (billed ? ' disabled' : '') + '><option value="">No plan (free until one is given)</option></select>' + (billed ? '<small>Billed through Stripe: change it there, or cancel it first.</small>' : '') + '</label>' +
                '<label class="ac-f">Billing email<input name="billingEmail" type="email" placeholder="Where bills are sent"></label>' +
                '<p class="ac-err"></p>' +
                '<div class="ac-bar"><button type="button" class="ac-btn" data-cancel>Cancel</button><button type="submit" class="ac-btn primary-acc">Save</button></div>' +
            '</form>';
            document.body.appendChild(m);
            var f = m.querySelector('form'), err = f.querySelector('.ac-err'), go = f.querySelector('[type=submit]');
            f.name.value = a.name; f.type.value = a.type || 'venue'; f.billingEmail.value = a.email || '';
            var close = function() { m.remove(); document.removeEventListener('keydown', onKey); };
            var onKey = function(e) { if (e.key === 'Escape') close(); };
            document.addEventListener('keydown', onKey);
            m.addEventListener('click', function(e) { if (e.target === m) close(); });
            f.querySelector('[data-cancel]').onclick = close;
            f.name.focus();
            var paintPlans = function() {
                if (!_plans) return;
                var t = f.type.value === 'management' ? 'label' : f.type.value, cur = f.plan.dataset.v != null ? f.plan.value : (a.planId || '');
                f.plan.dataset.v = '1';
                var price = {}; ((_plans.byType || {})[t] || []).forEach(function(p) { price[p.id] = p.price; });
                f.plan.innerHTML = '<option value="">No plan (free until one is given)</option>' + (_plans.plans || []).map(function(p) {
                    var pr = price[p.id] != null ? price[p.id] : p.price;
                    return '<option value="' + esc(p.id) + '"' + (p.id === cur ? ' selected' : '') + '>' + esc(p.name) + ' · ' + (pr > 0 ? '£' + pr.toLocaleString('en-GB') + ' a month' : 'pay as you go') + '</option>';
                }).join('');
            };
            (_plans ? Promise.resolve(_plans) : fetch('/api/plans').then(function(r) { return r.json(); })).then(function(d) { _plans = d; paintPlans(); }).catch(function() {});
            f.type.addEventListener('change', paintPlans);
            f.onsubmit = async function(e) {
                e.preventDefault();
                go.disabled = true; go.textContent = 'Saving…'; err.textContent = '';
                try {
                    var body = { action: 'edit', slug: a.slug, name: f.name.value.trim(), type: f.type.value, billingEmail: f.billingEmail.value.trim() };
                    if (!billed && _plans) body.plan = f.plan.value;
                    await post(body);
                    close();
                    laToast(f.name.value.trim() + ' saved');
                    load();
                } catch (er) { go.disabled = false; go.textContent = 'Save'; err.textContent = 'Could not save it: ' + er.message; }
            };
        }

        // Who signs in to the whole account: its own emails, and people added here (each gets the access email)
        function openLogins(a) {
            var m = document.createElement('div');
            m.className = 'ac-back';
            m.innerHTML = '<form class="ac-panel ac-new" role="dialog" aria-modal="true" aria-labelledby="ac-lt" autocomplete="off">' +
                '<h3 id="ac-lt">Logins for ' + esc(a.name) + '</h3>' +
                '<p>Everyone here signs in with Google and can use the whole account. Someone you add gets an email saying they have access and what they can do.</p>' +
                '<div class="ac-logins"></div>' +
                '<div class="ac-addrow"><input name="email" type="email" placeholder="name@venue.com" aria-label="Email to add" required><button type="submit" class="ac-btn primary-acc">Add and send email</button></div>' +
                '<p class="ac-err"></p>' +
                '<p class="ac-mail" aria-live="polite"></p>' +
                '<div class="ac-bar"><button type="button" class="ac-btn" data-cancel>Done</button></div>' +
            '</form>';
            document.body.appendChild(m);
            var f = m.querySelector('form'), err = f.querySelector('.ac-err'), go = f.querySelector('[type=submit]'), box = f.querySelector('.ac-logins'), mail = f.querySelector('.ac-mail');
            var paint = function(list) {
                a.logins = list;
                box.innerHTML = list.length ? list.map(function(l) {
                    return '<div class="ac-login"><span>' + esc(l.email) + '</span>' + (l.added ? '' : '<small>Account setup</small>') + '<button type="button" class="bl-x ac-x" data-rm="' + esc(l.email) + '" title="Remove this login" aria-label="Remove ' + esc(l.email) + '">×</button></div>';
                }).join('') : '<p class="ac-empty" style="margin:0">No logins yet.</p>';
            };
            paint(a.logins || []);
            var close = function() { m.remove(); document.removeEventListener('keydown', onKey); render(); };
            var onKey = function(e) { if (e.key === 'Escape') close(); };
            document.addEventListener('keydown', onKey);
            m.addEventListener('click', function(e) { if (e.target === m) close(); });
            f.querySelector('[data-cancel]').onclick = close;
            f.email.focus();
            box.addEventListener('click', async function(e) {
                var b = e.target.closest('[data-rm]'); if (!b) return;
                if (!(await laConfirm({ title: 'Remove ' + b.dataset.rm + '?', message: 'They can no longer sign in to ' + a.name + '. You can add them again any time.', confirmText: 'Remove login', danger: true }))) return;
                b.disabled = true; err.textContent = '';
                try { var d = await post({ action: 'removeLogin', slug: a.slug, email: b.dataset.rm }); paint(d.logins); laToast(b.dataset.rm + ' can no longer sign in to ' + a.name); }
                catch (er) { b.disabled = false; err.textContent = er.message; }
            });
            f.onsubmit = async function(e) {
                e.preventDefault();
                var email = f.email.value.trim();
                go.disabled = true; go.textContent = 'Adding…'; err.textContent = ''; mail.textContent = '';
                try {
                    var d = await post({ action: 'addLogin', slug: a.slug, email: email });
                    paint(d.logins); f.email.value = '';
                    mail.innerHTML = d.emailed ? esc(email + ' added. Access email: ') + deliveryText(d.delivery) : esc(email + ' added, but the email could not be sent' + (d.emailError ? ': ' + d.emailError : '.'));
                    laToast(email + ' added');
                } catch (er) { err.textContent = 'Could not add it: ' + er.message; }
                go.disabled = false; go.textContent = 'Add and send email';
            };
        }

        // A discount on the account's usage prices (storage, streaming, recording, files); the plan's price is unchanged
        function openDiscount(a) {
            var m = document.createElement('div');
            m.className = 'ac-back';
            m.innerHTML = '<form class="ac-panel" role="dialog" aria-modal="true" aria-labelledby="ac-dc">' +
                '<h3 id="ac-dc">Discount for ' + esc(a.name) + '</h3>' +
                '<p>Takes this much off every usage price on its bills: video storage, streaming, camera recording and file storage. The plan\'s own monthly price stays the same. It applies to the next bill and the estimate it sees now; 0 removes it.</p>' +
                '<label style="display:flex;align-items:center;gap:10px"><input type="number" min="0" max="100" step="0.5" inputmode="decimal" value="' + (a.discount || '') + '" placeholder="0" style="width:120px" aria-label="Discount in percent"><span style="font-size:14px;color:var(--la-sub)">% off usage</span></label>' +
                '<p class="ac-err"></p>' +
                '<div class="ac-bar"><button type="button" class="ac-btn" data-cancel>Cancel</button><button type="submit" class="ac-btn primary-acc">Save discount</button></div>' +
            '</form>';
            document.body.appendChild(m);
            var f = m.querySelector('form'), inp = f.querySelector('input'), err = f.querySelector('.ac-err'), go = f.querySelector('[type=submit]');
            var close = function() { m.remove(); document.removeEventListener('keydown', onKey); };
            var onKey = function(e) { if (e.key === 'Escape') close(); };
            document.addEventListener('keydown', onKey);
            m.addEventListener('click', function(e) { if (e.target === m) close(); });
            f.querySelector('[data-cancel]').onclick = close;
            inp.focus(); inp.select();
            f.onsubmit = async function(e) {
                e.preventDefault();
                var pct = inp.value.trim() === '' ? 0 : Number(inp.value);
                if (!(pct >= 0 && pct <= 100)) { err.textContent = 'Enter a discount from 0 to 100%.'; return; }
                go.disabled = true; go.textContent = 'Saving…'; err.textContent = '';
                try {
                    await post({ action: 'discount', slug: a.slug, percent: pct });
                    close();
                    laToast(pct ? a.name + ' gets ' + pct + '% off usage' : a.name + '\'s discount removed');
                    load();
                } catch (er) { go.disabled = false; go.textContent = 'Save discount'; err.textContent = 'Could not save: ' + er.message; }
            };
        }

        // Delete everywhere: typed name to confirm; runs again while videos are still being removed
        function openDelete(a) {
            var total = { videos: 0, cameras: 0 }, result = null;
            laConfirmDelete({
                title: 'Delete ' + a.name + ' everywhere?',
                message: 'It removes its plan in Stripe (cancelled now; paid invoices stay for your accounts), every video, clip, audio file and camera in its video storage, its Brand Kit, thumbnails, watermarks, contacts and settings, and every login to it.',
                name: a.slug, placeholder: 'Enter the account name', confirmText: 'Delete account',
                run: async function(ctl) {
                    for (var run = 0; run < 20; run++) {
                        ctl.label(run ? 'Deleting… ' + total.videos + ' videos so far' : 'Deleting…');
                        var d;
                        try { d = await post({ action: 'delete', slug: a.slug, confirm: a.slug }); }
                        catch (er) { throw new Error('Could not finish: ' + er.message + (total.videos ? ' (' + total.videos + ' videos already deleted)' : '')); }
                        total.videos += d.videos || 0; total.cameras += d.cameras || 0;
                        if (d.deleted) { result = d; return; }
                        if (!d.more) throw new Error('Could not finish: it stopped before finishing');
                    }
                    throw new Error('It is taking long. Press Delete again to finish.');
                }
            }).then(function(ok) {
                if (!ok || !result) return;
                laToast(a.name + ' deleted: ' + total.videos + ' videos, ' + (result.files || 0) + ' files' + (result.notes && result.notes.length ? '. ' + result.notes.join(' ') : ''));
                load();
            });
        }
        load();
    </script>
</body>
</html>
