        .bk-queue { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
        .bk-q { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--la-text-2); }
        .bk-q span:first-child { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .bk-q .bar { width:90px; height:4px; border-radius:4px; background:var(--la-chip); overflow:hidden; flex-shrink:0; }
        .bk-q .bar i { display:block; height:100%; width:0; background:var(--la-accent); transition:width .2s; }
        .bk-q .st { width:44px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--la-dim); flex-shrink:0; }
        .cam-form select { height:40px; border-radius:10px; border:1px solid var(--la-line); background:var(--la-input); color:var(--la-text); padding:0 10px; font-size:14px; outline:none; }
        .cam-form select:focus { border-color:var(--la-accent); }
        .bk-row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:640px) {
            .bk-row2 { grid-template-columns:1fr; }
            .bk-owner-head { flex-wrap:wrap; row-gap:12px; }
            .bk-owner-actions { width:100%; margin-left:0; }
            .bk-owner-actions .cam-btn { flex:1; justify-content:center; }
            .bk-files { grid-template-columns:repeat(2, minmax(0,1fr)); }
            .bk-toolbar .cam-actions { width:100%; }
            .bk-toolbar .cam-actions .cam-btn { flex:1 1 auto; justify-content:center; padding:0 10px; }
            .bk-toolbar .cam-actions .cam-btn.primary { flex-basis:100%; order:-1; }

<body class="font-sans antialiased bg-background text-foreground overflow-hidden h-screen w-screen flex selection:bg-primary selection:text-black">

                <span id="venue-breadcrumb" class="text-zinc-600 text-[10px] font-mono uppercase tracking-[0.3em] hidden md:inline"></span>

<button id="venue-avatar" onclick="openVenueEditor()" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center font-bold text-xs shrink-0 cursor-pointer hover:scale-105 transition-transform shadow-[0_0_10px_rgba(255,255,255,0.1)]" title="Change venue name"></button>

    <div id="cam-dialog" class="cam-dialog hidden" onclick="if(event.target===this)closeCamDialog()">
        <div class="cam-dialog-panel" role="dialog" aria-modal="true">
            <div class="cam-dialog-head">
                <p id="cam-dialog-title" class="cam-dialog-title"></p>
                <button type="button" class="cam-icon-btn" onclick="closeCamDialog()" aria-label="Close"><iconify-icon icon="solar:close-circle-linear"></iconify-icon></button>
            </div>
            <div id="cam-dialog-body"></div>
        </div>
    </div>

    <script type="module">
        import { upload } from 'https://cdn.jsdelivr.net/npm/@vercel/blob@2.3.3/client/+esm';
        import { downloadZip } from 'https://cdn.jsdelivr.net/npm/client-zip@2.5.0/index.js';
        window.blobUpload = upload;
        window.downloadZip = downloadZip;
    </script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }


        function laFetch(url, opts) {
            var sess = {}; try { sess = JSON.parse(localStorage.getItem('la_admin') || '{}'); } catch (_) {}
            opts = Object.assign({}, opts); opts.headers = Object.assign({}, opts.headers);
            if (sess.webToken) opts.headers['Authorization'] = 'Bearer ' + sess.webToken;
            return fetch(url, opts);
        }
        function session() { try { return JSON.parse(localStorage.getItem('la_admin') || '{}'); } catch (_) { return {}; } }
        function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function openCamDialog(title, html) {
            document.getElementById('cam-dialog-title').textContent = title;
            document.getElementById('cam-dialog-body').innerHTML = html;
            document.getElementById('cam-dialog').classList.remove('hidden');
        }
        function closeCamDialog() { if (_uploading) return; document.getElementById('cam-dialog').classList.add('hidden'); document.querySelector('#cam-dialog .cam-dialog-panel').classList.remove('wide'); }
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeCamDialog(); });

        // ── Brand kit ─────────────────────────────────────────────────────
        // Files are stored per owner: the venue, or "artist-<slug>" for each artist.
        var CATS = [
            { key: 'logos',      label: 'Logos',      icon: 'solar:star-shine-linear', tag: 'Logo' },
            { key: 'covers',     label: 'Album covers', icon: 'solar:vinyl-record-linear', tag: 'Album cover' },
            { key: 'artwork',    label: 'Artwork',    icon: 'solar:gallery-wide-linear', tag: 'Artwork' },
            { key: 'photos',     label: 'Photos',     icon: 'solar:camera-linear', tag: 'Photo' },
            { key: 'guidelines', label: 'Guidelines', icon: 'solar:document-text-linear', tag: 'Guidelines' },
            { key: 'fonts',      label: 'Fonts',      icon: 'solar:text-field-linear', tag: 'Font' },
            { key: 'other',      label: 'Other',      icon: 'solar:folder-linear', tag: 'Other' },
        ];
        var IMG_EXT = /\.(png|jpe?g|svg|webp|gif)$/i;
        var FONT_EXT = /\.(otf|ttf|woff2?)$/i;
        var _files = [], _owners = [], _uploading = false, _orgType = 'venue', _orgName = '', _ownerPhotos = {};
        var ORG_LABELS = { venue: 'Venue', label: 'Record label', management: 'Management' };

        function slugify(name) {
            return String(name).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
        }
        function fmtSize(b) { return b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }
        function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
        function venueName() {
            var s = session();
            return localStorage.getItem('la_venue_name') || s.venue || 'Venue';
        }
        function artistFromAsset(a) {
            var pt = a.passthrough;
            if (pt && typeof pt === 'object' && pt.artist) return pt.artist;
            if (typeof pt === 'string' && pt.trim()) {
                try { var o = JSON.parse(pt); if (o && o.artist) return o.artist; } catch (_) {}
                var n = pt.split(' // ')[0].split(' — ')[0].trim();
                if (n && !/^(SESSION_ARCHIVE|UNKNOWN)$/i.test(n)) return n;
            }
            return null;
        }

        async function loadBrand() {
            var err = document.getElementById('bk-error');
            try {
                var res = await Promise.all([
                    laFetch('/api/brand').then(function(r) { return r.json().then(function(d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); }),
                    laFetch('/api/list-assets').then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; }),
                ]);
                _files = res[0].files || [];
                _orgType = res[0].orgType || 'venue';
                _orgName = res[0].orgName || '';
                _ownerPhotos = res[0].ownerPhotos || {};
                var assets = Array.isArray(res[1]) ? res[1] : (res[1].data || []);
                var names = {};
                assets.forEach(function(a) { var n = artistFromAsset(a); if (n) names['artist-' + slugify(n)] = n.toUpperCase(); });
                _files.forEach(function(f) {
                    if (f.owner !== 'venue' && !names[f.owner]) names[f.owner] = f.owner.replace(/^(artist|venue)-/, '').replace(/-/g, ' ').toUpperCase();
                });
                var saved = res[0].ownerNames || {};
                Object.keys(saved).forEach(function(k) { names[k] = saved[k]; });
                var group = function(prefix, kind, label) {
                    return Object.keys(names).filter(function(k) { return k.indexOf(prefix) === 0; })
                        .sort(function(a, b) { return names[a].localeCompare(names[b]); })
                        .map(function(k) { return { key: k, name: names[k], kind: kind, group: label }; });
                };
                _owners = [{ key: 'venue', name: _orgName || venueName(), kind: ORG_LABELS[_orgType] + ' brand kit', org: true }]
                    .concat(group('venue-', 'Venue brand kit', 'Venues'), group('artist-', 'Artist brand kit', 'Artists'));
                err.classList.add('hidden');
                render();
            } catch (e) {
                err.textContent = 'Could not load the brand kit — ' + e.message;
                err.classList.remove('hidden');
            }
        }

        function render() {
            var wrap = document.getElementById('bk-owners');
            document.getElementById('bk-foot').textContent = _files.length + ' file' + (_files.length !== 1 ? 's' : '');
            var lastGroup = null;
            wrap.innerHTML = _owners.map(function(o) {
                var heading = '';
                if (o.group && o.group !== lastGroup) { heading = '<p class="bk-group">' + o.group + '</p>'; lastGroup = o.group; }
                var files = _files.filter(function(f) { return f.owner === o.key; });
                var logo = files.filter(function(f) { return f.category === 'logos' && IMG_EXT.test(f.name); })[0];
                var photo = _ownerPhotos[o.key];
                var usePhoto = photo && (o.key.indexOf('artist-') === 0 || !logo);
                var avatar = usePhoto ? '<img class="bk-avatar-photo" src="' + esc(photo) + '" alt="">'
                    : logo ? '<img src="' + esc(logo.url) + '" alt="" crossorigin="anonymous" onload="fitPreviewBg(this)" onerror="if(this.crossOrigin){this.removeAttribute(\'crossorigin\');this.src=this.src}">' : esc(o.name.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).map(function(w) { return w[0] || ''; }).join('').slice(0, 2) || '?');
                var body = '';
                if (!files.length) {
                    body = '<p class="bk-empty-owner">No brand files yet. <button type="button" data-up="' + esc(o.key) + '">Upload logos or guidelines</button></p>';
                } else {
                    // One grid, ordered logos → guidelines → fonts → other, each card tagged
                    var ordered = [];
                    CATS.forEach(function(c) { files.forEach(function(f) { if (f.category === c.key) ordered.push(f); }); });
                    body = '<div class="bk-files">' + ordered.map(fileCard).join('') + '</div>';
                }
                return heading + '<section class="bk-owner">' +
                    '<div class="bk-owner-head"><div class="bk-avatar">' + avatar + '</div>' +
                    '<div class="min-w-0"><p class="bk-owner-name">' + esc(o.name) + '</p><p class="bk-owner-meta">' + esc(o.kind) + ' · ' + files.length + ' file' + (files.length !== 1 ? 's' : '') +
                        (o.org ? ' · <button type="button" class="bk-org-edit" data-org>Edit</button>' : '') + '</p></div>' +
                    '<div class="bk-owner-actions">' +
                        (files.length ? '<button type="button" class="cam-btn ghost" data-zip="' + esc(o.key) + '"><iconify-icon icon="solar:download-minimalistic-linear"></iconify-icon><span>Download all</span></button>' : '') +
                        '<button type="button" class="cam-btn ghost" data-up="' + esc(o.key) + '"><iconify-icon icon="solar:upload-minimalistic-linear"></iconify-icon><span>Upload</span></button>' +
                    '</div></div>' +
                    '<div class="bk-body">' + body + '</div></section>';
            }).join('');
            wrap.querySelectorAll('[data-up]').forEach(function(b) { b.addEventListener('click', function() { openUpload(b.dataset.up); }); });
            wrap.querySelectorAll('.bk-font[data-font]').forEach(function(el) {
                loadBrandFont(el.dataset.font).then(function(family) {
                    el.querySelector('.bk-font-sample').style.fontFamily = family;
                    el.classList.add('ready');
                }).catch(function() { el.classList.add('failed'); });
            });
            wrap.querySelectorAll('[data-font-preview]').forEach(function(b) { b.addEventListener('click', function() { openFontPreview(b.dataset.fontPreview); }); });
            wrap.querySelectorAll('[data-photo]').forEach(function(b) {
                b.addEventListener('click', async function() {
                    b.disabled = true;
                    try {
                        var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setPhoto', url: b.dataset.photo }) });
                        var d = await r.json(); if (!r.ok) throw new Error(d.error || r.status);
                        _ownerPhotos[d.owner] = d.url; render();
                    } catch (e) { alert('Could not set the photo: ' + e.message); b.disabled = false; }
                });
            });
            wrap.querySelectorAll('[data-move]').forEach(function(b) { b.addEventListener('click', function() { openMove(b.dataset.move); }); });
            wrap.querySelectorAll('[data-org]').forEach(function(b) { b.addEventListener('click', openOrgType); });
            wrap.querySelectorAll('[data-zip]').forEach(function(b) { b.addEventListener('click', function() { downloadAll(b.dataset.zip, b); }); });
            wrap.querySelectorAll('[data-del]').forEach(function(b) { b.addEventListener('click', function() { removeFile(b.dataset.del, b); }); });
            wrap.querySelectorAll('[data-copy]').forEach(function(b) {
                b.addEventListener('click', function() {
                    navigator.clipboard.writeText(b.dataset.copy).then(function() {
                        var i = b.querySelector('iconify-icon'); i.setAttribute('icon', 'solar:check-circle-linear');
                        setTimeout(function() { i.setAttribute('icon', 'solar:link-round-linear'); }, 1500);
                    });
                });
            });
        }

        // Logo previews: dark backdrop behind light logos, light backdrop behind dark ones.
        // Measures the average brightness of the logo's visible (non-transparent) pixels.
        function fitPreviewBg(img) {
            var box = img.parentNode, tone = null;
            if (box.classList.contains('photo')) return;
            try {
                var c = document.createElement('canvas'), n = 48;
                c.width = n; c.height = n;
                var ctx = c.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0, n, n);
                var d = ctx.getImageData(0, 0, n, n).data, sum = 0, cnt = 0;
                for (var i = 0; i < d.length; i += 4) {
                    if (d[i + 3] < 40) continue;
                    sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; cnt++;
                }
                var opaque = cnt / (n * n);
                if (cnt && opaque < 0.97) tone = sum / cnt > 0.6 ? 'dark' : sum / cnt < 0.4 ? 'light' : null;
            } catch (_) {
                // Image not readable (no CORS): fall back to the file name
                if (/white|light|negative|reverse/i.test(img.src)) tone = 'dark';
                else if (/black|dark/i.test(img.src)) tone = 'light';
            }
            box.classList.remove('bg-dark', 'bg-light');
            if (tone) box.classList.add('bg-' + tone);
        }
        function flipPreviewBg(btn) {
            var box = btn.parentNode;
            var dark = box.classList.contains('bg-dark') || (!box.classList.contains('bg-light') && !document.documentElement.classList.contains('dark'));
            box.classList.toggle('bg-dark', !dark);
            box.classList.toggle('bg-light', dark);
        }

        // Fonts are loaded straight from the uploaded file with the FontFace API
        var _fontCache = {};
        function loadBrandFont(url) {
            if (!_fontCache[url]) {
                var family = 'bkfont-' + Object.keys(_fontCache).length;
                var face = new FontFace(family, 'url("' + url.replace(/"/g, '%22') + '")');
                _fontCache[url] = face.load().then(function(f) { document.fonts.add(f); return '"' + family + '", system-ui'; });
            }
            return _fontCache[url];
        }
        function openFontPreview(url) {
            var f = _files.filter(function(x) { return x.url === url; })[0] || { name: 'Font' };
            var name = f.name.replace(/\.[^.]+$/, '');
            openCamDialog(name,
                '<div class="bk-tester">' +
                '<input id="bk-tester-input" class="bk-tester-input" value="' + esc(name.replace(/[-_]+/g, ' ')) + '" maxlength="80" aria-label="Preview text">' +
                '<div id="bk-tester-out" class="bk-tester-out">' +
                    [56, 36, 22, 15].map(function(px) { return '<p data-sample style="font-size:' + px + 'px"></p>'; }).join('') +
                    '<p class="bk-tester-chars" style="font-size:18px">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789 &amp; ! ? @ £ € % ( ) . , : ;</p>' +
                '</div>' +
                '<p id="bk-tester-status" class="bk-meta">Loading font…</p>' +
                '<div class="cam-form-actions" style="margin-top:14px"><a class="cam-btn ghost" href="' + esc(f.link ? f.link + '?download' : f.downloadUrl || url) + '"><iconify-icon icon="solar:download-minimalistic-linear"></iconify-icon><span>Download</span></a></div>' +
                '</div>');
            document.querySelector('#cam-dialog .cam-dialog-panel').classList.add('wide');
            var input = document.getElementById('bk-tester-input'), out = document.getElementById('bk-tester-out');
            var sync = function() { out.querySelectorAll('[data-sample]').forEach(function(p) { p.textContent = input.value || 'Type something'; }); };
            input.addEventListener('input', sync); sync();
            loadBrandFont(url).then(function(family) {
                out.style.fontFamily = family;
                document.getElementById('bk-tester-status').textContent = f.size ? fmtSize(f.size) + ' · ' + f.name.split('.').pop().toUpperCase() : '';
            }).catch(function() {
                document.getElementById('bk-tester-status').textContent = 'This font file could not be previewed in the browser.';
            });
        }

        function fileCard(f) {
            var ext = (f.name.split('.').pop() || 'file').slice(0, 5);
            var cat = CATS.filter(function(c) { return c.key === f.category; })[0] || CATS[CATS.length - 1];
            var tagText = cat.key === 'photos' && f.owner.indexOf('artist-') === 0 ? (_ownerPhotos[f.owner] === f.url ? 'Artist photo' : 'Photo') : cat.tag;
            var tag = '<button type="button" class="bk-tag' + (_ownerPhotos[f.owner] === f.url ? ' is-profile' : '') + '" data-move="' + esc(f.url) + '" title="Change type"><iconify-icon icon="' + cat.icon + '"></iconify-icon>' + tagText + '<iconify-icon icon="solar:alt-arrow-down-linear" class="bk-tag-caret"></iconify-icon></button>';
            var isPhoto = f.category === 'covers' || f.category === 'artwork' || f.category === 'photos';
            var preview = IMG_EXT.test(f.name)
                ? '<div class="bk-preview' + (isPhoto ? ' photo' : '') + '">' + tag + '<img src="' + esc(f.url) + '" alt="" loading="lazy" crossorigin="anonymous" onload="fitPreviewBg(this)" onerror="if(this.crossOrigin){this.removeAttribute(\'crossorigin\');this.src=this.src}">' +
                    '<button type="button" class="bk-bg-toggle" title="Switch background" onclick="flipPreviewBg(this)"><iconify-icon icon="solar:sun-2-linear"></iconify-icon></button></div>'
                : FONT_EXT.test(f.name)
                ? '<div class="bk-preview doc bk-font" data-font="' + esc(f.url) + '">' + tag +
                    '<div class="bk-font-sample"><span class="aa">Aa</span><span class="line">ABC abc 123</span></div></div>'
                : '<div class="bk-preview doc">' + tag + '<div class="bk-ext"><iconify-icon icon="' + (/pdf/i.test(ext) ? 'solar:document-text-linear' : /ttf|otf|woff/i.test(ext) ? 'solar:text-field-linear' : /zip/i.test(ext) ? 'solar:zip-file-linear' : 'solar:file-linear') + '"></iconify-icon><span>' + esc(ext) + '</span></div></div>';
            return '<div class="bk-file">' + preview +
                '<div class="bk-info"><p class="bk-name" title="' + esc(f.name) + '">' + esc(f.name) + '</p><p class="bk-meta">' + fmtSize(f.size) + ' · ' + fmtDate(f.uploadedAt) + '</p></div>' +
                '<div class="bk-file-actions">' +
                    '<a href="' + esc(f.link ? f.link + '?download' : f.downloadUrl) + '" title="Download"><iconify-icon icon="solar:download-minimalistic-linear"></iconify-icon></a>' +
                    (IMG_EXT.test(f.name) || /pdf$/i.test(f.name) ? '<a href="' + esc(f.link || f.url) + '" target="_blank" rel="noopener" title="Open"><iconify-icon icon="solar:eye-linear"></iconify-icon></a>' : '') +
                    (f.category === 'photos' ? '<button type="button" data-photo="' + esc(f.url) + '" title="' + (f.owner.indexOf('artist-') === 0 ? 'Use as artist photo' : 'Use as profile photo') + '" class="' + (_ownerPhotos[f.owner] === f.url ? 'is-on' : '') + '"><iconify-icon icon="solar:user-circle-' + (_ownerPhotos[f.owner] === f.url ? 'bold' : 'linear') + '"></iconify-icon></button>' : '') +
                    (FONT_EXT.test(f.name) ? '<button type="button" data-font-preview="' + esc(f.url) + '" title="Preview font"><iconify-icon icon="solar:eye-linear"></iconify-icon></button>' : '') +
                    '<button type="button" data-copy="' + esc(f.link || f.url) + '" title="Copy link"><iconify-icon icon="solar:link-round-linear"></iconify-icon></button>' +
                    '<button type="button" class="del" data-del="' + esc(f.url) + '" title="Delete"><iconify-icon icon="solar:trash-bin-minimalistic-linear"></iconify-icon></button>' +
                '</div></div>';
        }

        function openUpload(ownerKey) {
            var opts = _owners.map(function(o) { return '<option value="' + esc(o.key) + '"' + (o.key === ownerKey ? ' selected' : '') + '>' + esc(o.name) + (o.key === 'venue' ? ' (' + ORG_LABELS[_orgType].toLowerCase() + ')' : '') + '</option>'; }).join('') +
                '<option value="__newVenue"' + (ownerKey === '__newVenue' ? ' selected' : '') + '>+ New venue…</option>' +
                '<option value="__newArtist"' + (ownerKey === '__newArtist' ? ' selected' : '') + '>+ New artist…</option>';
            openCamDialog('Upload brand files',
                '<form id="bk-form" class="cam-form">' +
                '<div class="bk-row2"><label>For<select name="owner">' + opts + '</select></label>' +
                '<label>Type<select name="category">' + CATS.map(function(c) { return '<option value="' + c.key + '">' + c.label + '</option>'; }).join('') + '</select></label></div>' +
                '<label id="bk-new-wrap" class="hidden"><span id="bk-new-label">Name</span><input name="newName" maxlength="60"></label>' +
                '<div id="bk-drop" class="bk-drop" tabindex="0"><iconify-icon icon="solar:cloud-upload-linear"></iconify-icon>Drop files here or <b>browse</b>' +
                    '<small>Logos, covers, artwork, photos, PDFs, AI/EPS, fonts or ZIP · up to 200 MB each</small></div>' +
                '<input id="bk-input" type="file" multiple class="hidden" accept=".png,.jpg,.jpeg,.svg,.webp,.gif,.pdf,.ai,.eps,.psd,.zip,.ttf,.otf,.woff,.woff2,.txt">' +
                '<div id="bk-queue" class="bk-queue"></div>' +
                '<p id="bk-form-error" class="cam-form-error"></p>' +
                '<div class="cam-form-actions"><button type="button" class="cam-btn ghost" onclick="closeCamDialog()">Cancel</button>' +
                '<button type="submit" class="cam-btn primary" disabled>Upload</button></div></form>');
            var form = document.getElementById('bk-form'), drop = document.getElementById('bk-drop'), input = document.getElementById('bk-input');
            var picked = [], catTouched = false;
            form.category.addEventListener('change', function() { catTouched = true; });
            var setPicked = function(list) {
                picked = Array.prototype.slice.call(list).filter(function(f) { return f.size > 0; });
                document.getElementById('bk-queue').innerHTML = picked.map(function(f, i) {
                    return '<div class="bk-q" id="bkq-' + i + '"><span>' + esc(f.name) + '</span><span class="bar"><i></i></span><span class="st">' + fmtSize(f.size) + '</span></div>';
                }).join('');
                form.querySelector('[type=submit]').disabled = !picked.length;
                // Suggest a type from the file, unless one was already chosen
                if (picked.length && !catTouched) {
                    var p0 = picked[0];
                    if (/\.(ttf|otf|woff2?)$/i.test(p0.name)) form.category.value = 'fonts';
                    else if (/pdf/.test(p0.type)) form.category.value = 'guidelines';
                    else if (/^image\//.test(p0.type)) form.category.value =
                        /cover|album|release|single|\bep\b/i.test(p0.name) ? 'covers'
                        : /artwork|poster|flyer|visual|graphic/i.test(p0.name) ? 'artwork'
                        : /photo|press|portrait|avatar|shot|img_|dsc/i.test(p0.name) || /jpe?g$/i.test(p0.name) ? 'photos' : 'logos';
                }
            };
            var syncNew = function() {
                var v = form.owner.value, isNew = v === '__newVenue' || v === '__newArtist';
                document.getElementById('bk-new-wrap').classList.toggle('hidden', !isNew);
                document.getElementById('bk-new-label').textContent = v === '__newVenue' ? 'Venue name' : 'Artist name';
                form.newName.placeholder = v === '__newVenue' ? 'e.g. Café 1001' : 'e.g. DJ TENNIS';
                if (isNew) setTimeout(function() { form.newName.focus(); }, 0);
            };
            form.owner.addEventListener('change', syncNew);
            syncNew();
            drop.addEventListener('click', function() { input.click(); });
            drop.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
            input.addEventListener('change', function() { setPicked(input.files); });
            ['dragenter', 'dragover'].forEach(function(t) { drop.addEventListener(t, function(e) { e.preventDefault(); drop.classList.add('over'); }); });
            ['dragleave', 'drop'].forEach(function(t) { drop.addEventListener(t, function(e) { e.preventDefault(); drop.classList.remove('over'); }); });
            drop.addEventListener('drop', function(e) { setPicked(e.dataTransfer.files); });
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                var errEl = document.getElementById('bk-form-error'); errEl.textContent = '';
                var owner = form.owner.value;
                if (owner === '__newVenue' || owner === '__newArtist') {
                    var nm = form.newName.value.trim(), isVenue = owner === '__newVenue';
                    if (!slugify(nm)) { errEl.textContent = 'Enter the ' + (isVenue ? 'venue' : 'artist') + ' name'; return; }
                    owner = (isVenue ? 'venue-' : 'artist-') + slugify(nm);
                    // Save the name as typed, so the brand kit shows "Café 1001" rather than "CAFE 1001"
                    await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOwnerName', owner: owner, name: nm }) }).catch(function() {});
                }
                var slug = session().venueSlug;
                if (!slug) { errEl.textContent = 'Sign in again to upload'; return; }
                var btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Uploading…';
                _uploading = true;
                var failed = 0;
                for (var i = 0; i < picked.length; i++) {
                    var f = picked[i], row = document.getElementById('bkq-' + i);
                    var safe = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+/, '').slice(-120) || 'file';
                    try {
                        await window.blobUpload('brand/' + slug + '/' + owner + '/' + form.category.value + '/' + safe, f, {
                            access: 'public',
                            handleUploadUrl: '/api/brand',
                            headers: { Authorization: 'Bearer ' + session().webToken },
                            multipart: f.size > 50 * 1024 * 1024,
                            onUploadProgress: function(p) { row.querySelector('i').style.width = p.percentage + '%'; row.querySelector('.st').textContent = Math.round(p.percentage) + '%'; },
                        });
                        row.querySelector('i').style.width = '100%'; row.querySelector('.st').textContent = 'Done';
                    } catch (er) {
                        failed++;
                        row.querySelector('.st').textContent = 'Failed';
                        row.querySelector('.st').style.color = 'var(--la-bad)';
                        errEl.textContent = 'Could not upload ' + f.name + ': ' + er.message;
                    }
                }
                _uploading = false;
                await loadBrand();
                if (!failed) closeCamDialog();
                else { btn.textContent = 'Close'; btn.disabled = false; btn.type = 'button'; btn.onclick = closeCamDialog; }
            });
        }

        function openOrgType() {
            var DESC = { venue: 'A club, bar or event space', label: 'Releases music for its artists', management: 'Manages one or more artists' };
            openCamDialog('Your brand kit',
                '<form id="bk-org-form" class="cam-form">' +
                '<label>Name<input name="orgName" maxlength="60" placeholder="' + esc(venueName()) + '" value="' + esc(_orgName) + '"><small>Shown on your brand kit, e.g. the label or venue name.</small></label>' +
                '<div class="bk-org-options">' + Object.keys(ORG_LABELS).map(function(k) {
                    return '<button type="button" class="bk-org-opt' + (k === _orgType ? ' on' : '') + '" data-type="' + k + '"><b>' + ORG_LABELS[k] + '</b><span>' + DESC[k] + '</span></button>';
                }).join('') + '</div>' +
                '<p id="bk-org-error" class="cam-form-error"></p>' +
                '<div class="cam-form-actions"><button type="button" class="cam-btn ghost" onclick="closeCamDialog()">Cancel</button><button type="submit" class="cam-btn primary">Save</button></div>' +
                '</form>');
            var form = document.getElementById('bk-org-form'), type = _orgType;
            form.querySelectorAll('.bk-org-opt').forEach(function(b) {
                b.addEventListener('click', function() {
                    type = b.dataset.type;
                    form.querySelectorAll('.bk-org-opt').forEach(function(x) { x.classList.toggle('on', x === b); });
                });
            });
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                var btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Saving…';
                try {
                    var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOrg', orgType: type, orgName: form.orgName.value }) });
                    var d = await r.json();
                    if (!r.ok) throw new Error(d.error || r.status);
                    _orgType = d.orgType; _orgName = d.orgName || '';
                    _owners[0].kind = ORG_LABELS[_orgType] + ' brand kit';
                    _owners[0].name = _orgName || venueName();
                    closeCamDialog(); render();
                } catch (er) {
                    document.getElementById('bk-org-error').textContent = 'Could not save: ' + er.message;
                    btn.disabled = false; btn.textContent = 'Save';
                }
            });
        }

        function openMove(url) {
            var f = _files.filter(function(x) { return x.url === url; })[0];
            if (!f) return;
            openCamDialog('Change type',
                '<p class="cam-dialog-text">' + esc(f.name) + '</p><div class="bk-org-options">' +
                CATS.map(function(c) {
                    return '<button type="button" class="bk-org-opt bk-cat-opt' + (c.key === f.category ? ' on' : '') + '" data-cat="' + c.key + '"><b><iconify-icon icon="' + c.icon + '"></iconify-icon> ' + c.label + '</b></button>';
                }).join('') + '</div><p id="bk-move-error" class="cam-form-error"></p>');
            document.querySelectorAll('.bk-cat-opt').forEach(function(b) {
                b.addEventListener('click', async function() {
                    if (b.dataset.cat === f.category) { closeCamDialog(); return; }
                    document.querySelectorAll('.bk-cat-opt').forEach(function(x) { x.disabled = true; });
                    b.querySelector('b').insertAdjacentHTML('beforeend', ' <span class="bk-meta">Moving…</span>');
                    try {
                        var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'move', url: url, category: b.dataset.cat }) });
                        if (!r.ok) throw new Error((await r.json()).error || r.status);
                        closeCamDialog(); await loadBrand();
                    } catch (e) {
                        document.getElementById('bk-move-error').textContent = 'Could not change type: ' + e.message;
                        document.querySelectorAll('.bk-cat-opt').forEach(function(x) { x.disabled = false; });
                    }
                });
            });
        }

        async function removeFile(url, btn) {
            var f = _files.filter(function(x) { return x.url === url; })[0];
            if (!(await laConfirm({ title: 'Delete ' + (f ? f.name : 'this file') + '?', message: 'It will be removed from the brand kit, and links to it will stop working. This can\'t be undone.', confirmText: 'Delete permanently', danger: true }))) return;
            btn.disabled = true;
            try {
                var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete', url: url }) });
                if (!r.ok) throw new Error((await r.json()).error || r.status);
                await loadBrand();
                laToast('File deleted');
            } catch (e) { alert('Could not delete: ' + e.message); btn.disabled = false; }
        }

        async function downloadAll(ownerKey, btn) {
            var owner = _owners.filter(function(o) { return o.key === ownerKey; })[0];
            var files = _files.filter(function(f) { return f.owner === ownerKey; });
            if (!files.length || !window.downloadZip) return;
            var label = btn.innerHTML; btn.disabled = true; btn.querySelector('span').textContent = 'Preparing…';
            try {
                var folder = (owner ? owner.name : 'brand').replace(/[^A-Za-z0-9 _-]+/g, '').trim() + ' brand kit';
                var used = {};
                var entries = await Promise.all(files.map(async function(f) {
                    var r = await fetch(f.url); if (!r.ok) throw new Error(f.name + ': ' + r.status);
                    var name = folder + '/' + f.category + '/' + f.name;
                    while (used[name]) name = name.replace(/(\.[^.\/]+)?$/, '-2$1');
                    used[name] = 1;
                    return { name: name, input: await r.blob() };
                }));
                var blob = await window.downloadZip(entries).blob();
                var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = folder + '.zip'; a.click();
                setTimeout(function() { URL.revokeObjectURL(a.href); }, 10000);
            } catch (e) { alert('Could not prepare the download: ' + e.message); }
            btn.disabled = false; btn.innerHTML = label;
        }

        loadBrand();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch(err => console.warn('SW:', err));
            });
        }
    </script>
</body>
