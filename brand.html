                '<label>Name<input name="orgName" maxlength="60" placeholder="' + esc(venueName()) + '" value="' + esc(_orgName) + '"><small>Shown on your brand kit, e.g. the label or venue name.</small></label>' +
                '<div class="bk-org-options">' + Object.keys(ORG_LABELS).map(function(k) {
                    return '<button type="button" class="bk-org-opt' + (k === _orgType ? ' on' : '') + '" data-type="' + k + '"><b>' + ORG_LABELS[k] + '</b><span>' + DESC[k] + '</span></button>';
                }).join('') + '</div>' +
                '<label>Genres<input name="ownerGenres" maxlength="120" placeholder="e.g. Disco, Jazz-funk, Soulful House" value="' + esc(_ownerGenres.venue || '') + '"><small>The music you are known for: used for the tags and genre when a set is posted to YouTube and SoundCloud.</small></label>' +
                '<label>Links<textarea name="ownerLinks" rows="3" placeholder="https://instagram.com/…&#10;https://yourwebsite.com" style="min-height:76px;padding:10px 12px;border-radius:10px;border:1px solid var(--la-line);background:var(--la-input);color:var(--la-text);font:inherit;resize:vertical">' + esc(_ownerLinks.venue || '') + '</textarea><small>One per line. Added to the description of every set posted.</small></label>' +
                (_orgType === 'artist' ? '<div class="bk-edit-more"><span>Record label</span><button type="button" class="cam-btn ghost bk-org-addlabel"><span>Add record label</span></button></div>' : '') +
                '<p id="bk-org-error" class="cam-form-error"></p>' +
                '<div class="cam-form-actions"><button type="button" class="cam-btn ghost" onclick="closeCamDialog()">Cancel</button><button type="submit" class="cam-btn primary">Save</button></div>' +
                '</form>');
            var form = document.getElementById('bk-org-form'), type = _orgType;
            var orgLabel = form.querySelector('.bk-org-addlabel');
            if (orgLabel) orgLabel.addEventListener('click', function() { var org = _owners.filter(function(x) { return x.org; })[0]; closeCamDialog(); openUpload('__newLabel:' + (org ? org.key : 'venue')); });
            form.querySelectorAll('.bk-org-opt').forEach(function(b) {
                b.addEventListener('click', function() {
                    type = b.dataset.type;
                    form.querySelectorAll('.bk-org-opt').forEach(function(x) { x.classList.toggle('on', x === b); });
                });
            });
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                var btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Saving…';
                try {
                    var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOrg', orgType: type, orgName: form.orgName.value }) });
                    var d = await r.json();
                    if (!r.ok) throw new Error(d.error || r.status);
                    _orgType = d.orgType; _orgName = d.orgName || '';
                    var r2 = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOwnerDetails', owner: 'venue', genres: form.ownerGenres.value, links: form.ownerLinks.value }) });
                    var d2 = await r2.json(); if (!r2.ok) throw new Error(d2.error || r2.status);
                    if (d2.genres) _ownerGenres.venue = d2.genres; else delete _ownerGenres.venue;
                    if (d2.links) _ownerLinks.venue = d2.links; else delete _ownerLinks.venue;
                    _owners[0].kind = ORG_LABELS[_orgType] + ' brand kit';
                    _owners[0].group = ORG_LABELS[_orgType];
                    _owners[0].name = _orgName || venueName();
                    closeCamDialog(); render();
                } catch (er) {
                    document.getElementById('bk-org-error').textContent = 'Could not save: ' + er.message;
                    btn.disabled = false; btn.textContent = 'Save';
                }
            });
        }

        // Rename a venue's or artist's brand kit (the account's own kit is edited with openOrgType)
        function openOwnerEdit(key) {
            var o = _owners.filter(function(x) { return x.key === key; })[0];
            if (!o) return;
            var isVenue = key.indexOf('venue-') === 0, isLabel = key.indexOf('label-') === 0, kindName = isVenue ? 'venue' : isLabel ? 'record label' : 'artist';
            openCamDialog(isVenue ? 'Edit venue' : isLabel ? 'Edit record label' : 'Edit artist',
                '<form id="bk-owner-form" class="cam-form">' +
                '<label>Name<input name="ownerName" maxlength="60" required value="' + esc(o.name) + '"><small>Shown on the brand kit, exactly as typed.</small></label>' +
                (isVenue || isLabel ? '' : '<label>Genres<input name="ownerGenres" maxlength="120" placeholder="e.g. Disco, Jazz-funk, Soulful House" value="' + esc(_ownerGenres[key] || '') + '"><small>Used for the tags and genre when a set is posted to YouTube and SoundCloud.</small></label>') +
                '<label>Links<textarea name="ownerLinks" rows="3" placeholder="https://instagram.com/…&#10;https://soundcloud.com/…" style="min-height:76px;padding:10px 12px;border-radius:10px;border:1px solid var(--la-line);background:var(--la-input);color:var(--la-text);font:inherit;resize:vertical">' + esc(_ownerLinks[key] || '') + '</textarea><small>Instagram, SoundCloud, website: one per line. Added to the description of every set posted.</small></label>' +
                (isVenue || isLabel ? '' : '<div class="bk-edit-more"><span>Record label</span><button type="button" class="cam-btn ghost bk-owner-addlabel"><span>Add record label</span></button></div>') +
                '<p id="bk-owner-error" class="cam-form-error"></p>' +
                '<div class="cam-form-actions">' +
                    '<button type="button" class="cam-btn la-danger bk-owner-del" style="margin-right:auto">Delete ' + kindName + '</button>' +
                    '<button type="button" class="cam-btn ghost" onclick="closeCamDialog()">Cancel</button><button type="submit" class="cam-btn primary">Save</button></div>' +
                '</form>');
            var form = document.getElementById('bk-owner-form');
            var del = form.querySelector('.bk-owner-del');
            if (del) del.addEventListener('click', function() { closeCamDialog(); deleteOwner(key, del); });
            var addLabel = form.querySelector('.bk-owner-addlabel');
            if (addLabel) addLabel.addEventListener('click', function() { closeCamDialog(); openUpload('__newLabel:' + key); });
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                var nm = form.ownerName.value.trim();
                if (!nm) return;
                var btn = form.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Saving…';
                try {
                    var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOwnerName', owner: key, name: nm }) });
                    var d = await r.json();
                    if (!r.ok) throw new Error(d.error || r.status);
                    o.name = d.name;
                    var r2 = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'setOwnerDetails', owner: key, genres: form.ownerGenres ? form.ownerGenres.value : '', links: form.ownerLinks.value }) });
                    var d2 = await r2.json(); if (!r2.ok) throw new Error(d2.error || r2.status);
                    if (d2.genres) _ownerGenres[key] = d2.genres; else delete _ownerGenres[key];
                    if (d2.links) _ownerLinks[key] = d2.links; else delete _ownerLinks[key];
                    closeCamDialog(); render(); renderWatermark();
                } catch (er) {
                    document.getElementById('bk-owner-error').textContent = 'Could not save: ' + er.message;
                    btn.disabled = false; btn.textContent = 'Save';
                }
            });
        }

        function openMove(url) {
            var f = _files.filter(function(x) { return x.url === url; })[0];
            if (!f) return;
            openCamDialog('Change type',
                '<p class="cam-dialog-text">' + esc(f.name) + '</p><div class="bk-org-options">' +
                CATS.map(function(c) {
                    return '<button type="button" class="bk-org-opt bk-cat-opt' + (c.key === f.category ? ' on' : '') + '" data-cat="' + c.key + '"><b>' + c.label + '</b></button>';
                }).join('') +
                (/\.(png|svg|webp|jpe?g|gif)$/i.test(f.name) ? '<button type="button" class="bk-org-opt bk-cat-opt' + (wmUsesLogo(f) ? ' on' : '') + '" data-cat="watermark"><b>Watermark</b><span>Saved as a logo and stamped bottom left on every vertical clip</span></button>' : '') +
                '</div><p id="bk-move-error" class="cam-form-error"></p>');
            document.querySelectorAll('.bk-cat-opt').forEach(function(b) {
                b.addEventListener('click', async function() {
                    if (b.dataset.cat === 'watermark') {
                        if (f.category === 'logos' || f.category === 'animations') { useLogoAsWatermark(f.url); return; }
                        b.dataset.cat = 'logos';
                        var asWatermark = true;
                    }
                    if (b.dataset.cat === f.category) { closeCamDialog(); return; }
                    document.querySelectorAll('.bk-cat-opt').forEach(function(x) { x.disabled = true; });
                    b.querySelector('b').insertAdjacentHTML('beforeend', ' <span class="bk-meta">Moving…</span>');
                    try {
                        var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'move', url: url, category: b.dataset.cat }) });
                        if (!r.ok) throw new Error((await r.json()).error || r.status);
                        closeCamDialog(); await loadBrand();
                        // Moved into logos: same file name in the logos folder
                        if (asWatermark) useLogoAsWatermark(url.replace('/' + f.category + '/', '/logos/'));
                    } catch (e) {
                        document.getElementById('bk-move-error').textContent = 'Could not change type: ' + e.message;
                        document.querySelectorAll('.bk-cat-opt').forEach(function(x) { x.disabled = false; });
                    }
                });
            });
        }

        async function deleteOwner(key, btn) {
            var o = _owners.filter(function(x) { return x.key === key; })[0];
            var n = _files.filter(function(f) { return f.owner === key; }).length;
            var what = key.indexOf('label-') === 0 ? 'record label' : key.indexOf('artist-') === 0 ? 'artist' : 'venue';
            if (!(await laConfirmDelete({ name: o ? o.name : what, placeholder: 'Enter the ' + what + ' name', title: 'Delete ' + (o ? o.name : 'this ' + what) + '?',
                message: 'The ' + what + ' and ' + (n ? 'its ' + n + ' file' + (n !== 1 ? 's' : '') : 'its brand kit') + ' will be removed, and links to them will stop working.' + (what === 'venue' ? ' Sessions keep the venue name as text.' : what === 'artist' ? ' Their sessions in Distribution History are not touched.' : '') + ' This can\'t be undone.',
                confirmText: 'Delete ' + what, danger: true }))) return;
            btn.disabled = true;
            try {
                var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'deleteOwner', owner: key }) });
                var d = await r.json(); if (!r.ok) throw new Error(d.error || r.status);
                await loadBrand();
                laToast(what.charAt(0).toUpperCase() + what.slice(1) + ' deleted');
            } catch (e) { btn.disabled = false; alert('Could not delete the ' + what + ': ' + e.message); }
        }

        async function removeFile(url, btn) {
            var f = _files.filter(function(x) { return x.url === url; })[0];
            if (!(await laConfirm({ title: 'Delete ' + (f ? f.name : 'this file') + '?', message: 'It will be removed from the brand kit, and links to it will stop working. This can\'t be undone.', confirmText: 'Delete permanently', danger: true }))) return;
            btn.disabled = true;
            try {
                var r = await laFetch('/api/brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete', url: url }) });
                if (!r.ok) throw new Error((await r.json()).error || r.status);
                await loadBrand();
                laToast('File deleted');
            } catch (e) { alert('Could not delete: ' + e.message); btn.disabled = false; }
        }

        async function downloadAll(ownerKey, btn) {
            var owner = _owners.filter(function(o) { return o.key === ownerKey; })[0];
            var files = _files.filter(function(f) { return f.owner === ownerKey; });
            if (!files.length || !window.downloadZip) return;
            var label = btn.innerHTML; btn.disabled = true; btn.querySelector('span').textContent = 'Preparing…';
            try {
                var folder = (owner ? owner.name : 'brand').replace(/[^A-Za-z0-9 _-]+/g, '').trim() + ' brand kit';
                var used = {};
                var entries = await Promise.all(files.map(async function(f) {
                    var r = await fetch(f.url); if (!r.ok) throw new Error(f.name + ': ' + r.status);
                    var name = folder + '/' + f.category + '/' + (f.post ? f.post + '/' : '') + f.name;
                    while (used[name]) name = name.replace(/(\.[^.\/]+)?$/, '-2$1');
                    used[name] = 1;
                    return { name: name, input: await r.blob() };
                }));
                var blob = await window.downloadZip(entries).blob();
                var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = folder + '.zip'; a.click();
                setTimeout(function() { URL.revokeObjectURL(a.href); }, 10000);
            } catch (e) { alert('Could not prepare the download: ' + e.message); }
            btn.disabled = false; btn.innerHTML = label;
        }

        loadBrand();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch(err => console.warn('SW:', err));
            });
        }
    </script>
</body>
</html>
