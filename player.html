<!DOCTYPE html>
<html lang="en" class="dark">
<script>(function(){var t=localStorage.getItem('la_theme');if(t==='light')document.documentElement.classList.remove('dark');else if(t==='auto'&&window.matchMedia('(prefers-color-scheme:light)').matches)document.documentElement.classList.remove('dark');})()</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="local / assets">
    <title>local / assets™ — Player</title>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="stylesheet" href="styles/tailwind.css">
    <link rel="stylesheet" href="styles/theme.css?v=10">
    <link rel="stylesheet" href="styles/page.css?v=1">
    <script>
        // Back: a player opened in its own tab closes it (the dashboard tab is still there); one reached from
        // a page of the site goes back to it; otherwise the dashboard
        function playerBack() {
            var fromSite = false;
            try { fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (_) {}
            if (window.opener && !window.opener.closed) { try { window.opener.focus(); } catch (_) {} window.close(); setTimeout(function() { location.href = '/dashboard'; }, 300); return false; }
            if (fromSite && history.length > 1) { history.back(); return false; }
            return true;   // follows the link to the dashboard
        }
    </script>
    <script>(function(){var t=localStorage.getItem('la_theme');if(t==='light')document.documentElement.classList.remove('dark');else if(t==='auto'){if(window.matchMedia('(prefers-color-scheme:light)').matches)document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');}else document.documentElement.classList.add('dark');})()</script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="/la-dialogs.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        html, body { height: 100%; height: 100dvh; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        mux-player { --media-object-fit: contain; width: 100%; height: 100%; display: block; }
        #player-container { padding: 24px max(env(safe-area-inset-right), 24px) max(env(safe-area-inset-bottom), 24px) max(env(safe-area-inset-left), 24px); }
        /* One video: a rounded frame, as on the dashboard */
        .pl-frame { width: 100%; height: 100%; max-width: 1600px; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--la-line); }
        .pl-empty { font-size: 14px; color: var(--la-dim); }
        .pl-audio { width: 100%; max-width: 560px; padding: 28px; border-radius: 16px; border: 1px solid var(--la-line); background: var(--la-surface); }
        .pl-audio p { margin: 0 0 16px; font-size: 13px; color: var(--la-sub); }
        .pl-audio audio { width: 100%; }
        .pl-image { max-width: 100%; max-height: 100%; border-radius: 16px; border: 1px solid var(--la-line); }
        @media (max-width: 640px) { #player-container { padding: 12px; } }
        /* Thumbnails: a grid of cards, each downloads on tap */
        .th-wrap { width: 100%; max-width: 1200px; margin: 0 auto; overflow-y: auto; max-height: 100%; }
        .th-count { margin: 0 0 16px; font-size: 14px; color: var(--la-sub); }
        .th-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding-bottom: 24px; }
        .th-card { position: relative; display: block; padding: 0; border: 1px solid var(--la-line); border-radius: 16px; overflow: hidden; background: var(--la-surface); cursor: pointer; transition: border-color .2s; }
        .th-card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
        .th-card:hover { border-color: var(--la-accent); }
        .th-dl { position: absolute; right: 12px; bottom: 12px; padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; font-weight: 500; opacity: 0; transition: opacity .2s; }
        .th-card:hover .th-dl, .th-card:focus-visible .th-dl { opacity: 1; }
        .th-num { position: absolute; left: 12px; bottom: 12px; font: 500 10px/1 'JetBrains Mono', ui-monospace, monospace; color: rgba(255,255,255,.75); }
        @media (hover: none) { .th-dl { opacity: 1; } }

        /* Vertical clips: the clip, its name and download, then the strip of all clips */
        #social-wrap { flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
        #main-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #main-player-slot { width: 100%; max-width: 400px; aspect-ratio: 9 / 16; max-height: 100%; position: relative; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--la-line); }
        #clip-info-bar { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 0 4px; }
        #clip-name-label { font-size: 14px; color: var(--la-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        #clip-dl-btn { min-height: 34px; padding: 0 14px; font-size: 12px; }
        #nav-strip { flex-shrink: 0; padding: 12px 0 0; }
        #nav-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 12px; }
        .nav-arrow { width: 36px; height: 36px; border: 1px solid var(--la-line); border-radius: 50%; background: var(--la-surface); color: var(--la-text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .2s, color .2s; flex-shrink: 0; }
        .nav-arrow:hover:not(:disabled) { border-color: var(--la-accent); color: var(--la-accent); }
        .nav-arrow:disabled { opacity: .3; cursor: default; }
        #clip-counter { font-size: 13px; color: var(--la-sub); text-align: center; min-width: 90px; }
        #filmstrip { display: flex; justify-content: safe center; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; scrollbar-color: var(--la-line) transparent; }
        .clip-thumb { flex-shrink: 0; width: 48px; cursor: pointer; transition: transform .15s; }
        .clip-thumb:hover { transform: translateY(-2px); }
        .clip-thumb-img { aspect-ratio: 9/16; background: var(--la-surface); overflow: hidden; border-radius: 8px; border: 1.5px solid transparent; transition: border-color .15s; }
        .clip-thumb.active .clip-thumb-img { border-color: var(--la-accent); }
        .clip-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: .8; display: block; }
        .clip-thumb.active img { opacity: 1; }
        .clip-thumb-num { font: 500 10px/1 'JetBrains Mono', ui-monospace, monospace; text-align: center; margin-top: 5px; color: var(--la-dim); }
        .clip-thumb.active .clip-thumb-num { color: var(--la-accent); }
    </style>
</head>
<body class="pg">

    <header class="pg-header">
        <div class="pg-left">
            <a href="/dashboard" onclick="return playerBack()" class="cam-btn ghost" aria-label="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Back</span>
            </a>
            <a href="/dashboard" class="pg-wordmark" aria-label="local / assets"></a>
            <span class="pg-sep wm"></span>
            <span id="asset-title" class="pg-title"></span>
        </div>
        <div class="pg-right">
            <button id="share-btn" type="button" class="cam-btn ghost" style="display:none">Share</button>
            <a id="download-link" href="#" download class="cam-btn primary hidden">Download</a>
        </div>
    </header>

    <main id="player-container" class="flex-1 flex flex-col items-center justify-center overflow-hidden" style="padding-bottom:var(--safe-bottom);">
    </main>

    <script>
        const params       = new URLSearchParams(window.location.search);
        // Only real video IDs and file names: they go into the page, so nothing else may get through
        const pid          = /^[A-Za-z0-9_-]{1,120}$/.test(params.get('v') || '') ? params.get('v') : null;
        const file         = /^[A-Za-z0-9_.-]{1,40}$/.test(params.get('f') || '') ? params.get('f') : null;
        const type         = params.get('type');
        const title        = params.get('title') ? decodeURIComponent(params.get('title')) : '';
        const socialsParam = params.get('socials');
        const activeIdx    = parseInt(params.get('active') || '0', 10);

        const container = document.getElementById('player-container');
        const titleEl   = document.getElementById('asset-title');
        const titleMob  = document.getElementById('asset-title-mobile');
        const dlLink    = document.getElementById('download-link');

        function setTitle(t) {
            if (titleEl)  titleEl.textContent  = t;
            if (titleMob) titleMob.textContent = t;
            document.title = 'local / assets™ — ' + t;
        }
        if (title) setTitle(title);

        // ── SOCIAL GALLERY MODE ──────────────────────────────────────────
        if (socialsParam) {
            const pids = socialsParam.split(',').filter(p => /^[a-zA-Z0-9_-]+$/.test(p));

            if (!pids.length) {
                container.innerHTML = '<p class="pl-empty">No clips yet.</p>';
            } else {
                const totalStr = String(pids.length);
                setTitle((title || 'Vertical clips') + ' · ' + totalStr + ' clips');

                let current = Math.min(activeIdx, pids.length - 1);

                // Remove default flex centering — social layout manages itself
                container.style.display    = 'block';
                container.style.padding    = '0';
                container.style.overflow   = 'hidden';
                container.style.flex       = '1';
                container.style.minHeight  = '0';

                container.innerHTML = `
                <div id="social-wrap">

                    <!-- 9:16 video area -->
                    <div id="main-area">
                        <div id="main-player-slot">
                            <mux-player id="main-mux"
                                stream-type="on-demand"
                                accent-color="#39FF14"
                                autoplay>
                            </mux-player>
                        </div>
                    </div>

                    <!-- Clip name + download -->
                    <div id="clip-info-bar">
                        <span id="clip-name-label"></span>
                        <button id="clip-dl-btn" class="cam-btn ghost">Download</button>
                    </div>

                    <!-- Navigation + filmstrip -->
                    <div id="nav-strip">
                        <div id="nav-row">
                            <button id="prev-btn" class="nav-arrow">
                                <iconify-icon icon="solar:alt-arrow-left-linear" style="font-size:16px;"></iconify-icon>
                            </button>
                            <span id="clip-counter">Clip 1 of ${totalStr}</span>
                            <button id="next-btn" class="nav-arrow">
                                <iconify-icon icon="solar:alt-arrow-right-linear" style="font-size:16px;"></iconify-icon>
                            </button>
                        </div>
                        <div id="filmstrip">
                            ${pids.map((p, i) => `
                                <div class="clip-thumb${i === current ? ' active' : ''}" data-idx="${i}">
                                    <div class="clip-thumb-img">
                                        <img src="https://image.mux.com/${p}/thumbnail.png?width=120&height=213&fit_mode=smartcrop&time=5" loading="lazy" alt="Clip ${i+1}">
                                    </div>
                                    <div class="clip-thumb-num">${String(i+1).padStart(2,'0')}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;

                const muxEl       = document.getElementById('main-mux');
                const filmstrip   = document.getElementById('filmstrip');
                const clipCounter = document.getElementById('clip-counter');
                const clipName    = document.getElementById('clip-name-label');
                const prevBtn     = document.getElementById('prev-btn');
                const nextBtn     = document.getElementById('next-btn');
                const dlBtn       = document.getElementById('clip-dl-btn');
                const baseTitle   = (title || 'CLIP').toUpperCase();

                function loadClip(idx) {
                    current = Math.max(0, Math.min(pids.length - 1, idx));

                    muxEl.setAttribute('playback-id', pids[current]);
                    clipCounter.textContent = 'Clip ' + (current + 1) + ' of ' + pids.length;
                    clipName.textContent    = baseTitle + ' · clip ' + String(current + 1).padStart(2, '0');
                    prevBtn.disabled = current === 0;
                    nextBtn.disabled = current === pids.length - 1;

                    // Download URL for this clip
                    const dlUrl = 'https://stream.mux.com/' + pids[current] + '/highest.mp4';
                    dlBtn.onclick = function() { downloadClip(dlUrl, current); };

                    // Update filmstrip
                    filmstrip.querySelectorAll('.clip-thumb').forEach(function(el) {
                        const active = parseInt(el.dataset.idx) === current;
                        el.classList.toggle('active', active);
                    });

                    // Scroll active thumb into view
                    const activeThumb = filmstrip.querySelector('.clip-thumb.active');
                    if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }

                filmstrip.addEventListener('click', function(e) {
                    const thumb = e.target.closest('.clip-thumb');
                    if (thumb) loadClip(parseInt(thumb.dataset.idx));
                });
                prevBtn.addEventListener('click', function() { loadClip(current - 1); });
                nextBtn.addEventListener('click', function() { loadClip(current + 1); });

                // Keyboard nav
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); loadClip(current + 1); }
                    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); loadClip(current - 1); }
                });

                loadClip(current);
            }

        // ── THUMBNAIL GALLERY MODE ───────────────────────────────────────
        } else if (params.get('thumbs')) {
            // Each entry is a Vercel Blob image URL or a legacy Mux playback ID
            const pids = params.get('thumbs').split(',').filter(p =>
                /^[a-zA-Z0-9_-]+$/.test(p) || /^https:\/\/[a-z0-9]+\.public\.blob\.vercel-storage\.com\/[A-Za-z0-9._\/-]+$/.test(p));
            setTitle((title || 'Thumbnails') + ' · ' + pids.length + ' images');
            container.style.alignItems  = 'flex-start';
            container.style.paddingTop  = '2rem';
            let gridHtml = '<div class="th-wrap">';
            gridHtml += '<p class="th-count">' + pids.length + ' thumbnail' + (pids.length !== 1 ? 's' : '') + ' · tap one to download</p>';
            gridHtml += '<div class="th-grid">';
            for (let i = 0; i < pids.length; i++) {
                const imgUrl = thumbImageUrl(pids[i]);
                gridHtml += '<button type="button" class="th-card" data-pid="' + pids[i].replace(/"/g, '') + '" data-idx="' + i + '">';
                gridHtml += '<img src="' + imgUrl + '" alt="Thumbnail ' + (i + 1) + '" loading="lazy">';
                gridHtml += '<span class="th-dl">Download</span><span class="th-num">' + String(i + 1).padStart(2, '0') + '</span>';
                gridHtml += '</button>';
            }
            gridHtml += '</div></div>';
            container.innerHTML = gridHtml;
            container.addEventListener('click', function(e) {
                const card = e.target.closest('[data-pid]');
                if (card) downloadThumbBlob(card.dataset.pid, parseInt(card.dataset.idx));
            });

        // ── SINGLE THUMB MODE ────────────────────────────────────────────
        } else if (!pid) {
            container.innerHTML = '<p class="pl-empty">This link has no video. Open it again from Distribution History.</p>';
        } else if (type === 'thumb') {
            const imgUrl = 'https://image.mux.com/' + pid + '/thumbnail.png?width=1920';
            container.innerHTML = '<img src="' + imgUrl + '" class="pl-image" alt="Thumbnail">';
            dlLink.href = imgUrl;
            dlLink.classList.remove('hidden');
            dlLink.classList.add('flex');

        // ── FILE / AUDIO / VIDEO MODE ────────────────────────────────────
        } else if (file) {
            const streamUrl = 'https://stream.mux.com/' + pid + '/' + file;
            const ext = file.split('.').pop().toLowerCase();
            if (ext === 'm4a' || ext === 'wav' || ext === 'mp3') {
                container.innerHTML = `
                    <div class="pl-audio"><p>${String(title || 'HQ audio').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))}</p>
                        <audio controls autoplay>
                            <source src="${streamUrl}" type="audio/${ext === 'm4a' ? 'mp4' : ext}">
                        </audio>
                    </div>`;
            } else {
                container.innerHTML = '<div class="pl-frame"><mux-player playback-id="' + pid + '" stream-type="on-demand" accent-color="#39FF14" autoplay style="width:100%;height:100%;"></mux-player></div>';
            }
            dlLink.href = streamUrl;
            dlLink.classList.remove('hidden');
            dlLink.classList.add('flex');

        // ── PLAIN PLAYBACK ID ─────────────────────────────────────────────
        } else {
            container.innerHTML = '<div class="pl-frame"><mux-player playback-id="' + pid + '" stream-type="on-demand" accent-color="#39FF14" autoplay style="width:100%;height:100%;"></mux-player></div>';
        }

        function downloadClip(url, idx) {
            // Try fetch → blob for forced download; fall back to opening in new tab
            fetch(url)
                .then(function(r) { return r.blob(); })
                .then(function(blob) {
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = (title || 'Clip').replace(/[^a-z0-9 _-]/gi, '') + '_' + String(idx + 1).padStart(2, '0') + '.mp4';
                    a.click();
                    setTimeout(function() { URL.revokeObjectURL(a.href); }, 10000);
                })
                .catch(function() { window.open(url, '_blank'); });
        }

        function thumbImageUrl(ref) {
            return ref.startsWith('https://') ? ref : 'https://image.mux.com/' + encodeURIComponent(ref) + '/thumbnail.png?width=1920';
        }
        function downloadThumbBlob(pid, idx) {
            const url = thumbImageUrl(pid);
            const ext = /\.jpe?g$/i.test(url) ? 'jpg' : 'png';
            fetch(url).then(r => r.blob()).then(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'Thumbnail_' + String(idx + 1).padStart(2, '0') + '.' + ext;
                a.click();
                URL.revokeObjectURL(a.href);
            }).catch(() => window.open(url, '_blank'));
        }
    </script>
<script>
    // Share to Instagram (Story or Reel), TikTok, WhatsApp… from a phone: the share sheet gets the video file itself.
    // iPhones only allow sharing straight after a tap, so the file is fetched first.
    (function () {
        var v = new URLSearchParams(location.search).get('v');
        var btn = document.getElementById('share-btn');
        if (!v || !btn) return;
        try { if (!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.mp4', { type: 'video/mp4' })] }))) return; } catch (_) { return; }
        var t = (new URLSearchParams(location.search).get('title') || 'clip').replace(/[^a-z0-9 _-]/gi, '').trim().replace(/\s+/g, '_') || 'clip';
        var file = null;
        btn.style.display = '';
        btn.disabled = true; btn.textContent = 'Preparing…';
        fetch('https://stream.mux.com/' + v + '/highest.mp4').then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
            .then(function (b) { file = new File([b], t + '.mp4', { type: b.type || 'video/mp4' }); btn.disabled = false; btn.textContent = 'Share'; })
            .catch(function () { btn.style.display = 'none'; });
        btn.addEventListener('click', function () { if (file) navigator.share({ files: [file] }).catch(function () {}); });
    })();
</script>
</body>
</html>
