<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="local / assets">
    <title>local / assets™ — Player</title>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="stylesheet" href="styles/tailwind.css">
    <link rel="stylesheet" href="styles/theme.css">
    <script>(function(){var t=localStorage.getItem('la_theme');if(t==='light')document.documentElement.classList.remove('dark');else if(t==='auto'){if(window.matchMedia('(prefers-color-scheme:light)').matches)document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');}else document.documentElement.classList.add('dark');})()</script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <style>
        :root {
            --safe-top:    env(safe-area-inset-top,    0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left:   env(safe-area-inset-left,   0px);
            --safe-right:  env(safe-area-inset-right,  0px);
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%; height: 100dvh;
            overflow: hidden;
        }
        body {
            background: #050505;
            margin: 0;
            display: flex;
            flex-direction: column;
            color: white;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
        }

        /* ── Header ── */
        #site-header {
            flex-shrink: 0;
            padding-top:   max(var(--safe-top),   14px);
            padding-left:  max(var(--safe-left),  20px);
            padding-right: max(var(--safe-right),  20px);
            padding-bottom: 14px;
            border-bottom: 1px solid #27272a;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 40;
            min-height: calc(var(--safe-top) + 52px);
        }

        /* ── Mux player base ── */
        mux-player {
            --media-object-fit: contain;
            width:  100%;
            height: 100%;
            display: block;
        }

        /* ── Social gallery layout ── */
        #social-wrap {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Video area */
        #main-area {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            padding: 12px 8px 8px;
        }

        /*
         * 9:16 slot:
         *   Desktop — max 400px wide (phone-screen feel), never stretched
         *   Mobile  — fills available height (full screen), video centered
         */
        #main-player-slot {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            max-height: 100%;
            position: relative;
            background: #000;
        }

        /* Below-video info bar */
        #clip-info-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #050505;
            gap: 12px;
        }
        #clip-name-label {
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #a1a1aa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        #clip-dl-btn {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid rgba(57,255,20,.35);
            border-radius: 20px;
            background: transparent;
            color: #39FF14;
            font-family: inherit;
            font-size: 8px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .15s;
            text-decoration: none;
        }
        #clip-dl-btn:hover { background: rgba(57,255,20,.07); }

        /* Navigation + filmstrip strip */
        #nav-strip {
            flex-shrink: 0;
            background: #050505;
            border-top: 1px solid #27272a;
            padding: 10px 16px;
            padding-bottom: max(10px, var(--safe-bottom));
        }
        #nav-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .nav-arrow {
            width: 34px; height: 34px;
            border: 1px solid #27272a;
            border-radius: 50%;
            background: transparent;
            color: #a1a1aa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .15s, color .15s;
            flex-shrink: 0;
        }
        .nav-arrow:hover:not(:disabled) { border-color: rgba(57,255,20,.5); color: #39FF14; }
        .nav-arrow:disabled { opacity: 0.25; cursor: default; }
        #clip-counter {
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #a1a1aa;
            text-align: center;
        }

        /* Filmstrip */
        #filmstrip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: thin;
            scrollbar-color: #27272a transparent;
        }
        #filmstrip::-webkit-scrollbar { height: 3px; }
        #filmstrip::-webkit-scrollbar-track { background: transparent; }
        #filmstrip::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
        .clip-thumb {
            flex-shrink: 0;
            width: 44px;
            cursor: pointer;
            transition: transform .12s;
        }
        .clip-thumb:hover { transform: scale(1.06); }
        .clip-thumb-img {
            aspect-ratio: 9/16;
            background: #0a0a0a;
            overflow: hidden;
            border-radius: 4px;
            border: 1.5px solid transparent;
            transition: border-color .12s;
        }
        .clip-thumb.active .clip-thumb-img { border-color: #39FF14; }
        .clip-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: .75; display: block; }
        .clip-thumb-num {
            font-size: 7px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            text-align: center;
            margin-top: 3px;
            color: #52525b;
            transition: color .12s;
        }
        .clip-thumb.active .clip-thumb-num { color: #39FF14; }

        /* Download button shimmer on hover (single-video mode) */
        #download-link:hover { background: rgba(57,255,20,.08); }
    </style>
</head>
<body>

    <header id="site-header">
        <div class="flex items-center gap-3 min-w-0">
            <a href="javascript:history.back()" class="flex items-center gap-2 hover:opacity-80 transition-opacity shrink-0">
                <iconify-icon icon="solar:alt-arrow-left-linear" style="color:#71717a;font-size:18px;"></iconify-icon>
                <span style="font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#71717a;">BACK</span>
            </a>
            <span style="color:#3f3f46;" class="hidden md:inline">|</span>
            <span style="font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#39FF14;font-weight:700;" class="hidden md:inline">local / assets™</span>
            <span style="color:#3f3f46;" class="hidden md:inline">|</span>
            <span id="asset-title" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#71717a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" class="hidden md:block"></span>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <span id="asset-title-mobile" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#71717a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;" class="md:hidden"></span>
            <a id="download-link" href="#" download class="hidden items-center gap-1.5 px-3 py-1.5 rounded-full border border-[#39FF14]/30 transition-colors">
                <iconify-icon icon="solar:download-bold" style="color:#39FF14;font-size:14px;"></iconify-icon>
                <span style="font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#39FF14;">DOWNLOAD</span>
            </a>
        </div>
    </header>

    <main id="player-container" class="flex-1 flex flex-col items-center justify-center overflow-hidden" style="padding-bottom:var(--safe-bottom);">
    </main>

    <script>
        const params       = new URLSearchParams(window.location.search);
        const pid          = params.get('v');
        const file         = params.get('f');
        const type         = params.get('type');
        const title        = params.get('title') ? decodeURIComponent(params.get('title')) : '';
        const socialsParam = params.get('socials');
        const activeIdx    = parseInt(params.get('active') || '0', 10);

        const container = document.getElementById('player-container');
        const titleEl   = document.getElementById('asset-title');
        const titleMob  = document.getElementById('asset-title-mobile');
        const dlLink    = document.getElementById('download-link');

        function setTitle(t) {
            if (titleEl)  titleEl.textContent  = t;
            if (titleMob) titleMob.textContent = t;
            document.title = 'local / assets™ — ' + t;
        }
        if (title) setTitle(title);

        // ── SOCIAL GALLERY MODE ──────────────────────────────────────────
        if (socialsParam) {
            const pids = socialsParam.split(',').filter(p => /^[a-zA-Z0-9_-]+$/.test(p));

            if (!pids.length) {
                container.innerHTML = '<p style="font-size:11px;font-family:monospace;text-transform:uppercase;letter-spacing:.2em;color:#52525b;">NO CLIPS</p>';
            } else {
                const totalStr = String(pids.length);
                setTitle((title || 'Social Pack') + ' — ' + totalStr + ' CLIPS');

                let current = Math.min(activeIdx, pids.length - 1);

                // Remove default flex centering — social layout manages itself
                container.style.display    = 'block';
                container.style.padding    = '0';
                container.style.overflow   = 'hidden';
                container.style.flex       = '1';
                container.style.minHeight  = '0';

                container.innerHTML = `
                <div id="social-wrap">

                    <!-- 9:16 video area -->
                    <div id="main-area">
                        <div id="main-player-slot">
                            <mux-player id="main-mux"
                                stream-type="on-demand"
                                accent-color="#39FF14"
                                autoplay>
                            </mux-player>
                        </div>
                    </div>

                    <!-- Clip name + download -->
                    <div id="clip-info-bar">
                        <span id="clip-name-label"></span>
                        <button id="clip-dl-btn">
                            <iconify-icon icon="solar:download-bold" style="font-size:13px;"></iconify-icon>
                            DOWNLOAD
                        </button>
                    </div>

                    <!-- Navigation + filmstrip -->
                    <div id="nav-strip">
                        <div id="nav-row">
                            <button id="prev-btn" class="nav-arrow">
                                <iconify-icon icon="solar:alt-arrow-left-linear" style="font-size:16px;"></iconify-icon>
                            </button>
                            <span id="clip-counter">CLIP 1 / ${totalStr}</span>
                            <button id="next-btn" class="nav-arrow">
                                <iconify-icon icon="solar:alt-arrow-right-linear" style="font-size:16px;"></iconify-icon>
                            </button>
                        </div>
                        <div id="filmstrip">
                            ${pids.map((p, i) => `
                                <div class="clip-thumb${i === current ? ' active' : ''}" data-idx="${i}">
                                    <div class="clip-thumb-img">
                                        <img src="https://image.mux.com/${p}/thumbnail.png?width=120&height=213&fit_mode=smartcrop&time=5" loading="lazy" alt="Clip ${i+1}">
                                    </div>
                                    <div class="clip-thumb-num">${String(i+1).padStart(2,'0')}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;

                const muxEl       = document.getElementById('main-mux');
                const filmstrip   = document.getElementById('filmstrip');
                const clipCounter = document.getElementById('clip-counter');
                const clipName    = document.getElementById('clip-name-label');
                const prevBtn     = document.getElementById('prev-btn');
                const nextBtn     = document.getElementById('next-btn');
                const dlBtn       = document.getElementById('clip-dl-btn');
                const baseTitle   = (title || 'CLIP').toUpperCase();

                function loadClip(idx) {
                    current = Math.max(0, Math.min(pids.length - 1, idx));

                    muxEl.setAttribute('playback-id', pids[current]);
                    clipCounter.textContent = 'CLIP ' + (current + 1) + ' / ' + pids.length;
                    clipName.textContent    = baseTitle + ' — CLIP ' + String(current + 1).padStart(2, '0');
                    prevBtn.disabled = current === 0;
                    nextBtn.disabled = current === pids.length - 1;

                    // Download URL for this clip
                    const dlUrl = 'https://stream.mux.com/' + pids[current] + '/highest.mp4';
                    dlBtn.onclick = function() { downloadClip(dlUrl, current); };

                    // Update filmstrip
                    filmstrip.querySelectorAll('.clip-thumb').forEach(function(el) {
                        const active = parseInt(el.dataset.idx) === current;
                        el.classList.toggle('active', active);
                    });

                    // Scroll active thumb into view
                    const activeThumb = filmstrip.querySelector('.clip-thumb.active');
                    if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }

                filmstrip.addEventListener('click', function(e) {
                    const thumb = e.target.closest('.clip-thumb');
                    if (thumb) loadClip(parseInt(thumb.dataset.idx));
                });
                prevBtn.addEventListener('click', function() { loadClip(current - 1); });
                nextBtn.addEventListener('click', function() { loadClip(current + 1); });

                // Keyboard nav
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); loadClip(current + 1); }
                    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); loadClip(current - 1); }
                });

                loadClip(current);
            }

        // ── THUMBNAIL GALLERY MODE ───────────────────────────────────────
        } else if (params.get('thumbs')) {
            const pids = params.get('thumbs').split(',').filter(p => /^[a-zA-Z0-9_-]+$/.test(p));
            setTitle((title || 'Thumbnails') + ' — ' + pids.length + ' images');
            container.style.alignItems  = 'flex-start';
            container.style.paddingTop  = '2rem';
            let gridHtml = '<div class="w-full max-w-6xl px-4">';
            gridHtml += '<p class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest mb-4">' + pids.length + ' THUMBNAIL' + (pids.length !== 1 ? 'S' : '') + '</p>';
            gridHtml += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">';
            for (let i = 0; i < pids.length; i++) {
                const imgUrl = 'https://image.mux.com/' + encodeURIComponent(pids[i]) + '/thumbnail.png?width=1920';
                gridHtml += '<div class="group relative rounded-xl overflow-hidden border border-[#27272a] hover:border-[#39FF14]/50 transition-all cursor-pointer" data-pid="' + pids[i].replace(/"/g, '') + '" data-idx="' + i + '">';
                gridHtml += '<img src="' + imgUrl + '" class="w-full aspect-video object-cover" alt="Thumbnail ' + (i + 1) + '" loading="lazy">';
                gridHtml += '<div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">';
                gridHtml += '<span class="text-[9px] font-mono text-[#39FF14] uppercase tracking-widest">DOWNLOAD</span>';
                gridHtml += '</div>';
                gridHtml += '<span class="absolute bottom-2 left-2 text-[8px] font-mono text-white/50 uppercase">' + String(i + 1).padStart(2, '0') + '</span>';
                gridHtml += '</div>';
            }
            gridHtml += '</div></div>';
            container.innerHTML = gridHtml;
            container.addEventListener('click', function(e) {
                const card = e.target.closest('[data-pid]');
                if (card) downloadThumbBlob(card.dataset.pid, parseInt(card.dataset.idx));
            });

        // ── SINGLE THUMB MODE ────────────────────────────────────────────
        } else if (!pid) {
            container.innerHTML = '<p class="text-zinc-600 font-mono text-xs uppercase tracking-widest">NO ASSET SPECIFIED</p>';
        } else if (type === 'thumb') {
            const imgUrl = 'https://image.mux.com/' + pid + '/thumbnail.png?width=1920';
            container.innerHTML = '<img src="' + imgUrl + '" class="max-w-full max-h-[80vh] rounded-xl shadow-2xl border border-[#27272a]" alt="Thumbnail">';
            dlLink.href = imgUrl;
            dlLink.classList.remove('hidden');
            dlLink.classList.add('flex');

        // ── FILE / AUDIO / VIDEO MODE ────────────────────────────────────
        } else if (file) {
            const streamUrl = 'https://stream.mux.com/' + pid + '/' + file;
            const ext = file.split('.').pop().toLowerCase();
            if (ext === 'm4a' || ext === 'wav' || ext === 'mp3') {
                container.innerHTML = `
                    <div class="w-full max-w-lg text-center space-y-6 px-6">
                        <div class="w-24 h-24 mx-auto bg-[#0a0a0a] border border-[#27272a] rounded-2xl flex items-center justify-center">
                            <iconify-icon icon="solar:music-note-bold" class="text-[#39FF14] text-3xl"></iconify-icon>
                        </div>
                        <audio controls autoplay class="w-full" style="filter:hue-rotate(90deg) brightness(1.2);">
                            <source src="${streamUrl}" type="audio/${ext === 'm4a' ? 'mp4' : ext}">
                        </audio>
                    </div>`;
            } else {
                container.innerHTML = '<mux-player playback-id="' + pid + '" stream-type="on-demand" accent-color="#39FF14" autoplay style="width:100%;height:100%;"></mux-player>';
            }
            dlLink.href = streamUrl;
            dlLink.classList.remove('hidden');
            dlLink.classList.add('flex');

        // ── PLAIN PLAYBACK ID ─────────────────────────────────────────────
        } else {
            container.innerHTML = '<mux-player playback-id="' + pid + '" stream-type="on-demand" accent-color="#39FF14" autoplay style="width:100%;height:100%;"></mux-player>';
        }

        function downloadClip(url, idx) {
            // Try fetch → blob for forced download; fall back to opening in new tab
            fetch(url)
                .then(function(r) { return r.blob(); })
                .then(function(blob) {
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = (title || 'Clip').replace(/[^a-z0-9 _-]/gi, '') + '_' + String(idx + 1).padStart(2, '0') + '.mp4';
                    a.click();
                    setTimeout(function() { URL.revokeObjectURL(a.href); }, 10000);
                })
                .catch(function() { window.open(url, '_blank'); });
        }

        function downloadThumbBlob(pid, idx) {
            const url = 'https://image.mux.com/' + pid + '/thumbnail.png?width=1920';
            fetch(url).then(r => r.blob()).then(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'Thumbnail_' + String(idx + 1).padStart(2, '0') + '.png';
                a.click();
                URL.revokeObjectURL(a.href);
            }).catch(() => window.open(url, '_blank'));
        }
    </script>
</body>
</html>
